# sbot 的 Slack App manifest —— 在 api.slack.com/apps → Create New App → From an app manifest 粘贴这份
#
# ⚠ 两台机器(两台机器)各建一个 App,这份 manifest 用两次、改一下 name 即可。
#   理由见 docs/SLACK.md「必须一开始就定对的三件事」:Socket Mode 多连接是**随机分发不是广播**,
#   共用一个 app token 会让消息随机落到其中一台,表现为「时灵时不灵」。
#
# ⚠ 建完还要手工做两步(manifest 覆盖不到):
#   1. Basic Information → App-Level Tokens → Generate → 勾 connections:write → 拿 xapp-
#   2. OAuth & Permissions → Install to Workspace → 拿 xoxb-
#   然后把 bot 拉进频道:/invite @sintbot —— 不做这步收不到任何消息。
#
# ⚠ **已经建过 app 的,改这份 manifest 之后要重装**(App Manifest 页粘贴 → Save Changes →
#   Reinstall to Workspace)。2026-09-03 这版新增了 `app_home` 与 `app_home_opened`:
#   不重装的表现是**主页永远空白、日志里一条 `views.publish` 失败** —— 不影响任何一轮任务。
#   ⭐ 反过来,主页的**文案**是 daemon 运行时发布的,改文案不用再动 manifest。
#
# 📌 未含 app_mentions:read 是**有意的**:已有 channels:history 就会收到频道每一条消息,
#    自己匹配 bot user id 即可判断被 @;同时订阅 app_mention 会让 @ 消息投递两次(cc-bot 踩过)。
#    详见 docs/SLACK.md「scope 与 manifest」。

display_information:
  name: sintbot
  description: 从群聊驱动无头编码 agent
  background_color: "#0a0a0a"

features:
  bot_user:
    display_name: sintbot
    always_online: false
  # ⭐ App Home 主页 = 群内控制面的第三层入口(前两层 = 线程里的按钮 · `!` 前缀)。
  #   内容由 daemon 运行时 views.publish 上去 ⇒ **改文案不用重装 app**,只有这个开关要。
  #   ⚠ 它讲的只是「在 Slack 里怎么用」,**不放命令表** —— 表是按群算的(权限/模型/画布都不同),
  #     而 App Home 是按人发布的,放上去只能对一个群是准的。命令表仍走 `!help`。
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # ⭐ 实测必需:不开这个,agents.sessions.setStatus 一律报 not_authorized。
  #   它是 Agent Sessions(原生 Working… 状态 + Stop 按钮)的开关,与付不付费无关。
  agent_view:
    agent_description: 从群聊驱动无头编码 agent,跑完把结果回到线程里。
  # ⚠⚠ **Slack 自己吃掉 `/` 开头的输入**(真机 2026-09-01:群里发 `/status`,消息根本没到过 bot)
  #   ⇒ 群内控制面(stop/skip/new/status/help/hud/model/issue)必须有别的入口。
  #   这里注册**一个总入口**而不是 8 个命令:① Slack 内置就占着 /status、/remind 等常用名,
  #   逐个注册会撞;② 一个入口只占一个名字,冲突面最小;③ 自带自动补全与 usage 提示。
  #   ⭐ 不重装 app 也有退路:适配器认替代前缀 `!stop`(见 docs/SLACK.md「群内控制面」)。
  # ⚠⚠ **注册的斜杠命令在消息线程(thread)里根本调不出来**(官方明文,只有 Slack 内置命令与
  #   Giphy 例外)。而本产品的进度与回复都挂在线程里 ⇒ `/sint` 只在频道里有用,**主入口必须是
  #   `!` 前缀**;注册它的收益只剩「频道里有自动补全」。
  # ⚠ 斜杠命令**不做 namespace**:同名后装的静默覆盖先装的,不报错也无从察觉 ⇒ `/sint` 随时可能
  #   被客户 workspace 里别的 app 抢走。故前缀与总入口名都做成了配置项(slack.commandAlias /
  #   slack.umbrellaCommand)。
  slash_commands:
    - command: /sint
      description: 控制这个群的任务
      usage_hint: stop | skip | new | status | help | hud | model | issue
      should_escape: false

oauth_config:
  scopes:
    bot:
      # 收消息 —— ⚠ 四个前缀互不覆盖:channels=公开频道 / groups=私有频道 / im=单人DM / mpim=群组DM
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      # 频道信息与成员
      - channels:read
      - groups:read
      - channels:join
      - channels:manage
      - groups:write
      - users:read
      # 发消息 · 编辑 · 删除(编辑删除只能对自己发的)
      - chat:write
      - chat:write.public
      # 文件上下行
      - files:read
      - files:write
      # reaction 回执
      - reactions:write
      # 主动发起 DM 会话才需要;收/回 DM 用 im:history + chat:write 就够
      - im:write
      # 上面注册了斜杠命令就必须有它,否则 Slack 拒收这份 manifest(「Slash Commands requires `commands` bot scope」)
      - commands

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      # ⚠ 不订阅它,setStatus 会返回 missing_agent_session_stopped_event_subscription 警告,
      #   用户看到的是一个不可点击的转圈 —— 等于 Stop 按钮消失
      - agent_session_stopped
      # App Home 主页要靠它触发发布(⚠ 两个页签都会来,适配器按 tab==='home' 筛)
      - app_home_opened
    # ⚠ socket_mode_enabled 为 true 时不需要 request_url
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false   # ⚠ 这是单向开关,开了就关不掉,且 access token 会 12 小时过期
