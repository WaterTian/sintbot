<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" role="img" aria-label="Sintbot">
  <!-- SintBot 标记:黑盘白字、盘外透明。
       字形在原路径里是镂空(nonzero 反绕),所以要先垫一枚同径白圆盘才让镂空处露白 —— 少了它,字形会直接透出标签栏底色。 -->
  <circle cx="50" cy="50" r="50" fill="#fff"/>
  <path fill="#000" d="M100,50A50,50,0,1,1,50,0,50,50,0,0,1,100,50ZM22.08,42.76,64,63.69l-7,3.49H43l-7-3.49v-7l-14,7v7l14,7H64l14-7v-14l-14-7,14-7v-14l-14-7v14l-14,7-14-7v-14l-14,7Z"/>
</svg>
