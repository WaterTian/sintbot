<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sintbot">
  <title>Sintbot</title>
  <!-- 金手指/引脚:先画,压在板下层露出边缘 -->
  <g fill="#c9a25c">
    <rect x="1.5" y="22" width="5" height="7" rx="1"/>
    <rect x="1.5" y="34" width="5" height="7" rx="1"/>
    <rect x="57.5" y="22" width="5" height="7" rx="1"/>
    <rect x="57.5" y="34" width="5" height="7" rx="1"/>
    <rect x="17" y="53.5" width="7" height="5" rx="1"/>
    <rect x="28.5" y="53.5" width="7" height="5" rx="1"/>
    <rect x="40" y="53.5" width="7" height="5" rx="1"/>
  </g>
  <!-- 板 -->
  <rect x="5" y="8" width="54" height="48" rx="4.5" fill="#235c3c"/>
  <!-- 丝印内框 -->
  <rect x="8.5" y="11.5" width="47" height="41" rx="2.5" fill="none" stroke="#3d8155" stroke-width="1"/>
  <!-- S 走线:每个拐角切成两个 45°,PCB 不允许 90° 直角走线 -->
  <path d="M44 20 H24 L20 24 V28 L24 32 H40 L44 36 V40 L40 44 H20"
        fill="none" stroke="#d68f44" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 两端:起点过孔(环)/终点焊盘(实心) -->
  <circle cx="44" cy="20" r="3.6" fill="#235c3c" stroke="#e5b94d" stroke-width="2.2"/>
  <circle cx="20" cy="44" r="3.4" fill="#e5b94d"/>
</svg>
