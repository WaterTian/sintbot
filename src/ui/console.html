// Patch only the live regions — no innerHTML churn on the animated cards.
let lastActSig='';
function updateOverviewLive(){
  if(!S) return;
  const live=S.live||{};
  const active=(live.concurrency&&live.concurrency.active)||0;
  const g=$('#ovGauge'); if(g)$$('.seg',g).forEach((s,i)=>s.classList.toggle('on',i<active));
  const a=$('#ovActive'); if(a)a.textContent=active;
  const q=$('#ovQueue'); if(q)q.textContent=live.queue||0;
  $$('#overview [data-g]').forEach(el=>{const lv=(live.groups&&live.groups[el.dataset.g])||{};
    el.className='tag glive '+(lv.busy?'busy':'idle');
    el.textContent=lv.finalizing?'收尾中':(lv.busy?('busy '+(lv.sinceMs?Math.round(lv.sinceMs/1000)+'s':'')):'idle');
    el.title=(lv.finalizing?'答案已发送 · 进程收尾中(新消息会排队)':(lv.busy?'运行中':'空闲'))+(lv.sessionId?(' · 会话 #'+String(lv.sessionId).slice(-6)):' · 无会话');});
  // Self-heal stuck 'running' rows: a done SSE frame can be lost on a reconnect gap and
  // SSE has no replay, so the row would spin forever. Per-group turns are serialized, so a
  // 'running' row whose group is no longer busy has finished (busy=false ⇔ the turn settled
  // ⇔ its done was already emitted server-side, just not received) → resolve it. The real
  // done, if it arrives late, still overwrites this by id.
  // ⚠ 只自愈**已存在够久**的 running 行。turn 的 start 帧是即时推的,live 是 3s 心跳快照 ⇒
  // start 刚到时,手里那份 live 必然还显示该群不忙;不设这道闸就会把刚建的行当场判成已完成,
  // 结果转圈状态从来不显示、非手动刷新不可见(实测必现,不是偶发)。8s ≈ 2 个心跳周期。
  activity.forEach(a=>{if(a.status==='running'&&Date.now()-(a.runAt||0)>8000){const e=Object.entries(live.groups||{}).find(x=>x[0].slice(-8)===a.group);if(e&&!e[1].busy)a.status='✓';}});
  const sig=activity.map(a=>a.id+a.status+(a.open?'o':'')).join('|');
  if(sig!==lastActSig){lastActSig=sig;const a=$('#ovActivity');if(a)a.innerHTML=activityHtml();bindActivityClicks();}
}
/* 群卡「预览」行的策略文字:**报实际生效值**(顶层默认 30 分钟/8 小时,叠加按群覆盖)。
   写死默认数字会在 operator 手配 idleMin:5 时说谎 —— 显示与实际脱节是这个项目栽过多次的坑。 */
function previewPolicyText(g){
  const pv=(g&&g.preview)||{};
  const idle=pv.idleMin===undefined?30:Number(pv.idleMin);
  const max=pv.maxHours===undefined?8:Number(pv.maxHours);
  if(!idle&&!max)return '不自动回收(常驻)';
  const bits=[];
  if(idle)bits.push('闲置 '+idle+' 分钟');
  if(max)bits.push('最长 '+max+' 小时');
  return bits.join(' / ')+'自动停';
}
function shortPath(p){if(!p)return '';const parts=p.replace(/\\/g,'/').split('/');return parts.length>2?'…/'+parts.slice(-2).join('/'):p;}

/* ── 自动刷新(2026-07-30 真机反馈:「数据不能自动刷新,得手点右上角」)──
   SSE 心跳只带 {live, conn} ⇒ 只有并发格/群忙闲/实时活动是活的;健康卡、群卡标签、
   预览服务区、设置页全靠整页拉取。实测 /api/state 首次 90ms、之后 1ms(版本探针有缓存)
   ⇒ 定时全量刷新几乎零成本,当初不做是设计疏漏而非性能取舍。
   三条纪律,防「刷新把人正在做的事冲掉」:
     ① 页面不可见(切到别的标签页/最小化)不刷 —— 省得白跑,回来时立刻补一次;
     ② 正在操作时不刷:模态框开着 / 焦点在输入控件里 / 正在拖拽排序;
     ③ 只有内容真变了才重渲染(签名比对)—— 否则每次无谓重画会打断 hover、
        折叠态与滚动位置。签名故意剔掉 live/conn/time(它们本就走心跳,进签名会每帧变)。*/
const AUTO_REFRESH_MS=60000;
let autoTimer=null,lastStateSig=null;
/* 签名要反映**屏幕上显示的东西**,不是原始毫秒:previews 的 upMs/lastReqMs/idleLeftMs 每次拉取
   都在变,直接进签名 ⇒ 只要有预览在跑就每次必重画,「变了才画」形同失效(hover/滚动被反复
   打断)。而这些数字是用 fmtDur 按**分钟**显示的 ⇒ 折成分钟后,签名恰好在显示文字会变时才变。
   live/conn/time 整块剔掉(它们走 3s 心跳,进签名会每帧变)。 */
function stateSig(s){try{
  const {live,conn,time,previews,...rest}=s||{};
  const pv=(previews||[]).map(p=>[p.id,p.port,p.label,p.serveRoot,p.projectRoot,p.reqCount,
    Math.round((p.upMs||0)/60000),p.lastReqMs==null?null:Math.round(p.lastReqMs/60000),
    p.idleLeftMs==null?null:Math.round(p.idleLeftMs/60000)]);
  return JSON.stringify([rest,pv]);
}catch{return null;}}
function busyInteracting(){
  if($('#modalBg')&&$('#modalBg').classList.contains('show'))return true;      // 模态框开着
  if(document.querySelector('.card.dragging'))return true;                      // 拖拽排序中
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return true;                // 正在填表
  return false;
}
/* 只自动重画「概览」:它是纯展示(健康/并发/群忙闲/预览服务/实时活动),没有任何输入控件 ⇒
   重画绝不会冲掉没提交的内容。其余页签(群·项目/模型/设置/试跑)都带输入,改为**按需重画**:
   切过去时若状态确有变化才重画(签名比对)—— 既不会看到陈旧数据,也不会把填了一半的表单清掉。
   注:切页签本身只 toggle CSS 类、不重渲染,所以不补这一步的话非当前页签会一直陈旧。 */
const tabRenderers={overview:()=>renderOverview(),groups:()=>renderGroups(),providers:()=>renderProviders(),settings:()=>renderSettings(),playground:()=>renderPlayground()};
const tabSig={};
function renderTabIfStale(id){
  const f=tabRenderers[id]; if(!f)return;
  if(tabSig[id]===lastStateSig)return;   // 这个页签上次就是按这份状态画的 ⇒ 不动 DOM
  tabSig[id]=lastStateSig; f();
}
async function autoRefresh(){
  if(document.visibilityState!=='visible'||busyInteracting()||!TOKEN)return;
  try{
    const r=await api('/api/state');
    const sig=stateSig(r);
    S=r;
    if(sig!==lastStateSig){
      lastStateSig=sig;
      renderOverview(); tabSig.overview=sig;   // 纯展示,直接重画
      updateDaemon();updateTopFxApp();         // 顶栏两块在页签之外,得跟 updateDaemon 一起显式更新
    }else{updateDaemon();updateOverviewLive();updateConnLive();}
  }catch{/* 断网/401 交给 SSE 那条自愈路径,这里静默 */}
}
function startAutoRefresh(){
  if(autoTimer)return;
  lastStateSig=stateSig(S);
  // 开局所有页签都刚被 renderAll 按这份状态画过 ⇒ 全部种上当前签名。不种的话:在设置页填一半、
  // 切到概览再切回来,会被判「陈旧」而重画、把没提交的输入冲掉 —— 正是这套机制要避免的那个场景。
  Object.keys(tabRenderers).forEach(k=>{tabSig[k]=lastStateSig;});
  autoTimer=setInterval(autoRefresh,AUTO_REFRESH_MS);
  // 切回页面立刻补一次(不可见期间跳过的那些,回来时一次补齐)
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoRefresh();});
}

/* ── 卡片拖拽排序引擎(模型 / 群项目共用) ──
   交互:抓 ⠿ 拖起整卡(原位变虚线占位,拖影 = 整卡快照);拖动掠过其他卡即
   实时让位,被挤开的卡以 FLIP 平滑滑到新位置 — 让位后拖卡恰好落在指针下,
   布局自稳定;滑动中的卡不参与命中(防振荡)。松手即提交所见顺序(所见即
   所得);保存失败自动回滚归位。尊重 prefers-reduced-motion。
   ⚠ 教训:不要用环境信号做逻辑门槛 — computed transform 会被 stagger 入场
   动画(fill:both)污染成 matrix 而永拦让位;dragend 的 dropEffect 判取消也
   不可靠。改为自维护的 SLIDING 集合 + 一律提交。 */
const REDUCED_MOTION=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SLIDING=new WeakSet();  // flipMove 滑动中的元素(自维护,替代读 computed transform)
function flipMove(grid,mutate){
  const items=[...grid.children];
  const first=items.map(el=>[el,el.getBoundingClientRect()]);  // 含飞行中 transform → 可中断续接
  mutate();
  // 清 stagger 入场动画(fill:both 会压过 inline transform)+ 清旧 transform 量真实终位
  for(const [el] of first){el.style.animation='none';el.style.transition='none';el.style.transform='';}
  const delta=first.map(([el,f])=>{const l=el.getBoundingClientRect();return [el,f.left-l.left,f.top-l.top];});
  for(const [el,dx,dy] of delta){
    if((dx||dy)&&!REDUCED_MOTION)el.style.transform=`translate(${dx}px,${dy}px)`;  // invert:先钉回视觉原位
    else el.style.transition='';
  }
  if(REDUCED_MOTION)return;
  void grid.offsetWidth;  // 落定 invert 帧
  for(const [el,dx,dy] of delta)if(dx||dy){
    el.style.transition='transform .28s cubic-bezier(.2,.72,.28,1.02)';
    el.style.transform='';  // play:滑向新位置
    SLIDING.add(el);
    const done=()=>{el.style.transition='';SLIDING.delete(el);};
    el.addEventListener('transitionend',done,{once:true});
    setTimeout(done,360);  // transitioncancel / 事件丢失兜底
  }
}
function makeSortable(grid,{item,key,save}){
  if(!grid)return;
  let drag=null,startOrder=null,cool=0;
  const cards=()=>[...grid.querySelectorAll(item)];
  const restore=order=>{const byKey=new Map(cards().map(c=>[key(c),c]));
    flipMove(grid,()=>{for(const k of order){const c=byKey.get(k);if(c)grid.appendChild(c);}});};
  const allowDrop=e=>{if(drag){e.preventDefault();e.dataTransfer.dropEffect='move';}};  // 页面任意处松手=提交
  grid.addEventListener('dragover',e=>{
    if(!drag)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    const t=e.target.closest(item);
    if(!t||t===drag||!grid.contains(t))return;
    if(SLIDING.has(t))return;  // 目标还在滑动中,等落位再让(防振荡)
    const now=Date.now();if(now-cool<100)return;cool=now;
    const kids=cards(),di=kids.indexOf(drag),ti=kids.indexOf(t);
    if(di<0||ti<0)return;
    flipMove(grid,()=>grid.insertBefore(drag,di<ti?t.nextSibling:t));
  });
  grid.addEventListener('drop',e=>e.preventDefault());
  for(const c of cards()){
    const h=c.querySelector('.drag');if(!h)continue;
    h.addEventListener('dragstart',e=>{
      drag=c;startOrder=cards().map(key);
      const r=c.getBoundingClientRect();
      e.dataTransfer.setDragImage(c,e.clientX-r.left,e.clientY-r.top);  // 拖影 = 整卡而非把手
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('application/x-sbot-sort',key(c));  // 自定义类型:满足 Firefox 启动条件,且 textarea 不会吞文本
      document.addEventListener('dragover',allowDrop);document.addEventListener('drop',allowDrop);
      setTimeout(()=>c.classList.add('dragging'));  // 下一帧再变占位,拖影快照保持原样
    });
    h.addEventListener('dragend',async()=>{
      document.removeEventListener('dragover',allowDrop);document.removeEventListener('drop',allowDrop);
      c.classList.remove('dragging');drag=null;
      const order=cards().map(key);
      if(order.join()===startOrder.join())return;  // 没动(含 Esc 后浏览器自身取消),不保存
      try{S=await save(order);toast('顺序已保存','ok');}
      catch(err){restore(startOrder);toast(err.message,'err');}
    });
  }
}

// codex 订阅额度 → 紧凑单行「5h:98% (1.8h) │ 7d:12% (6.1d)」。
// ⚠ **百分比是「已用」**(v0.11.8 口径改版,与 Claude 卡同款;此前显示的是「剩」,正好相反)。
// resetsAt 兼容两种口径:>1e9 视作绝对 epoch 秒,否则视作「距重置的秒数」;算出的倒计时须
// 为正且 <9 天(否则丢弃,防脏值),故 Windows 若字段缺失只是不显示括号、不出错(零回归)。
// 窗口标签按 windowMins 推导(非按位置)—— codex 已把「周」窗口挪到 primary(secondary=null),
// 旧的 primary='5h' 会把周窗口误标成 5h(与 codexstatus.windowLabel 同源)。
function fmtDur(ms){const trim=(v)=>v<10?String(Number(v.toFixed(1))):String(Math.round(v));const h=ms/3600e3;if(h>=24)return trim(h/24)+'d';if(h>=1)return trim(h)+'h';return Math.max(1,Math.round(ms/60e3))+'m';}
function fmtReset(w){if(!w||w.resetsAt==null)return'';const ms=w.resetsAt>1e9?(w.resetsAt*1000-Date.now()):(w.resetsAt*1000);if(ms<=0||ms>9*864e5)return'';return fmtDur(ms);}
function winLabel(mins){if(!mins)return'窗口';if(mins>=1440){const d=Math.round(mins/1440);return d===7?'7d':d+'d';}return Math.round(mins/60)+'h';}
function fmtUsage(u){if(!u)return'';const f=(w)=>{if(!w)return'';const r=fmtReset(w);return `${winLabel(w.windowMins)}:${Math.min(100,Math.max(0,Math.round(w.usedPercent||0)))}%${r?` (${r})`:''}`;};return [f(u.primary),f(u.secondary)].filter(Boolean).join(' │ ');}

      <div class="kv"><span class="kk">model</span><span class="vv" title="${esc(p.model||(p.loggedIn&&p.runner!=='codex'?'未指定 ⇒ spawn 时不设 ANTHROPIC_MODEL,用 Claude Code 自己的默认模型':''))}">${esc(p.model||(p.loggedIn&&p.runner!=='codex'?'跟随 Claude Code 默认':'—'))}</span></div>
      <div class="kv"><span class="kk">endpoint</span><span class="vv" title="${esc(p.runner==='codex'?'Codex CLI(codex exec · 订阅登录)':(p.baseUrl||'本机 Claude Code 的登录态 —— 无需 baseUrl / API key'))}">${esc(p.runner==='codex'?'Codex CLI (订阅登录)':(p.baseUrl?p.baseUrl.replace('https://',''):'Claude 订阅登录'))}</span></div>
      ${p.effort?`<div class="kv"><span class="kk">思考深度</span><span class="vv">${esc(p.effort)}</span></div>`:''}
      ${p.vision===false?'<div class="kv"><span class="kk">识图</span><span class="vv" title="纯文本模型:送给它的图片(群里发的图/网页截图/读取的图片文件)自动降级成占位文本,不会 400 崩掉整轮">不支持 · 图片自动降级</span></div>':''}
      ${p.runner==='codex'?`<div class="kv"><span class="kk">推理强度</span><span class="vv">${esc(p.reasoningEffort||cxDefEffortLabel(p.model))}</span></div>`:''}
      ${usage[p.name]?`<div class="kv"><span class="kk" style="flex:none">${esc(usage[p.name].label)}${usageRefreshBtn(false)}</span><span class="vv" title="${esc(usage[p.name].value)}${usage[p.name].label==='订阅额度'?' —— 百分比 = 已用,括号 = 距重置,与这台机器上交互式 Claude Code 共享的订阅窗口':''}" style="color:var(--ok);font-weight:600;white-space:normal;overflow:visible;max-width:none;flex:1;min-width:0;line-height:1.5">${esc(usage[p.name].value)}</span></div>`:''}
      ${(cs&&cs.usageText)?`<div class="kv"><span class="kk" style="flex:none">订阅额度${usageRefreshBtn(true)}</span><span class="vv" title="百分比 = 已用,括号 = 距重置 —— 与交互式 Codex 共享的订阅窗口(时长随官方口径)" style="color:var(--ok);font-weight:600;white-space:normal;overflow:visible;max-width:none;flex:1;min-width:0;line-height:1.5">${esc(cs.usageText)}</span></div>`:''}
      <div class="acts"><button class="btn" data-act="test">测试</button>${p.hidden?'<span class="hint" style="align-self:center">已隐藏</span>':''}</div>
      <div class="reply-slot"></div>
    </div>`;
  }).join('');
  const extra=S.providers.filter(p=>p.hidden||!p.configured).length;
  const toggle=extra?`<button class="btn ghost" id="showAll">${showAll?'只看已配置':`显示全部 (${extra})`}</button>`:'';
  $('#providers').innerHTML=`<div class="inline" style="justify-content:space-between;align-items:flex-start;margin:0 2px 14px;gap:10px">
      <div class="hint" style="flex:1">管理模型 · 拖 ${IC.grip} 排序 · ${IC.settings} 配端点/key/思考深度 · 模型按群在「群·项目」选</div>
      <div class="inline" style="gap:8px">${toggle}<button class="btn primary" id="addModel">${IC.plus} 添加模型</button></div></div>
    <div class="grid cols2 stagger" id="pgrid">${cards}</div>
    <h2 class="sec" style="margin-top:32px">插件库 · MCP</h2>
    <div class="hint" style="margin:0 2px 14px">本机装好的 MCP · 按运行时分两套 · 命令行安装、即时刷新</div>
    <div id="plugLib"><span class="spin"></span></div>
    <h2 class="sec" style="margin-top:32px">设计风格库<button class="btn ghost" id="styleRescan" title="重新扫描风格预设(导入或改过自定义风格后用)" style="margin-left:10px;padding:2px 9px;font-size:10.5px;vertical-align:middle">重新扫描</button><button class="btn" id="styleNew" title="用一张表单配一套自己的风格:色板、圆角、字重逐项定,右侧实时看效果。存进库后全部群都能用" style="margin-left:6px;padding:2px 9px;font-size:10.5px;vertical-align:middle">＋ 新建风格</button></h2>
    <div class="hint" style="margin:0 2px 14px">图标由风格档的 tokens 实时派生,改了色板/圆角当场跟着变 · 在群里说一句即可给某个项目定风格 · 当前哪个项目用哪套,看「群·项目」页群卡的「设计风格」行</div>
    <div id="styleLib"><span class="spin"></span></div>
    <h2 class="sec" style="margin-top:32px">图标库</h2>
    <div class="hint" style="margin:0 2px 14px">与设计风格<b>平级</b>:风格管怎么画(颜色/字体/圆角/描边),图标库管图形从哪来、叫什么名 · 一个项目分别选,在「群·项目」页那个群的「图标」行</div>
    <div id="iconLib"><span class="spin"></span></div>`;
  // 风格库与插件库同性质(全局资源、按群使用)⇒ 同住「模型」页;此前放在「群·项目」页底部,
  // 既概念错位、又占掉那一页 45% 版面(得滚过所有群卡才看得见)。
  loadStyleLib();
  loadIconLib();
  $('#styleRescan').onclick=async()=>{styleLib=null;$('#styleLib').innerHTML='<span class="spin"></span>';await loadStyleLib();toast('风格库已重新扫描','ok');};
  $('#styleNew').onclick=()=>openStyleModal(null);
  if($('#showAll'))$('#showAll').onclick=()=>{showAll=!showAll;renderProviders();};
  $('#addModel').onclick=()=>openProviderModal(null);
  makeSortable($('#pgrid'),{item:'.pcard',key:c=>c.dataset.prov,save:o=>api('/api/providers/order','POST',{order:o})});
  $$('#pgrid .pcard').forEach(card=>{
    const name=card.dataset.prov, slot=$('.reply-slot',card);
    card.addEventListener('click',async e=>{
      const b=e.target.closest('button[data-act]'); if(!b)return;
      if(b.dataset.act==='edit'){openProviderModal(name);return;}
      if(b.dataset.act==='usage'){
        const cx=b.dataset.cx==='1', row=b.closest('.kv'), vv=row&&$('.vv',row);
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>';
        try{
          let text=null;
          if(cx){const r=await api('/api/codex/verify','POST',{force:true});const lg=r.login||{};text=fmtUsage(r.usage);
            /* 探测失败(fmtUsage 给空串)时保住原来的额度:这一行的 DOM 留着旧值,内存态却清空的话,
               下次重画整行会凭空消失 —— 同一份状态两个消费者,漏一个就自相矛盾。 */
            codexStatus[name]={loggedIn:lg.loggedIn,mode:lg.mode,usageText:text||((codexStatus[name]||{}).usageText||'')};}
          else{const r=await api('/api/usage/refresh','POST',{name});if(r.usage){usage[name]=r.usage;text=r.usage.value;}}
          /* 就地改这一行,不走 renderProviders —— 整页重画会把这颗按钮连同它的 finally 一起换掉,
             还会打断 hover 与试跑回执。拉不到时**留着旧值**:清空会被读成「这个模型没额度」。 */
          if(text&&vv)vv.textContent=text;
          toast(text?'额度已更新 · '+text:'暂时取不到额度,显示的仍是上一次的值',text?'ok':'err');
        }catch(e){toast(e.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;}
        return;
      }
      if(b.dataset.act==='test'){
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>测试中';slot.innerHTML='';
        try{const r=await api('/api/test','POST',{provider:name});
          slot.innerHTML=`<div class="reply ${r.ok?'':'err'}">${r.ok?esc(r.reply)+`\n\n<span class='faint'>— ${esc(r.model)} · ${r.ms}ms</span>`:IC.x+' '+esc(r.error)}</div>`;
          toast(r.ok?name+' 测试通过':name+' 测试失败',r.ok?'ok':'err');
        }catch(err){slot.innerHTML=`<div class="reply err">${IC.x} ${esc(err.message)}</div>`;toast(err.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;}
      }
    });
  });
  // 插件库(Claude Code + codex MCP,住「模型」页底):两套 MCP 各一子卡 —— Claude Code(~/.claude.json,
  // `claude mcp add --scope user`)与 Codex(~/.codex/config.toml,`codex mcp add`,官方
  // developers.openai.com/codex/mcp)。/api/plugins/exec 是操作台开放终端,两卡共用执行/刷新;
  // codex 卡仅在配了 codex provider 时出现。不参与上方模型卡的拖动排序。
  // min-width:0 关键:grid 子项默认 min-width:auto,长命令(npx …)会撑大 min-content 破坏 1fr 1fr → 两卡不等宽。
  const libSection=(id,tag,cls,cfg,arr,ph,help,gated)=>`
    <div class="card" style="padding:15px 17px;min-width:0">
      <div class="inline" style="justify-content:space-between;margin-bottom:9px">
        <span class="cli-tag ${cls}" style="flex:none">${tag}</span>
        <span class="hint" style="white-space:nowrap"><code>${cfg}</code> · ${arr.length}</span></div>
      ${arr.length?arr.map(m=>`<div class="kv" style="padding:5px 0;min-width:0"><span class="kk mono" style="flex:none">${esc(m.name)}</span><span class="vv" title="${esc(m.detail)}">${esc(m.detail||'MCP')}</span>${reachChip(m.reach)}</div>`).join(''):`<div class="hint" style="padding:3px 0">暂无 · 用下方命令添加</div>`}
      ${arr.some(m=>m.reach&&m.reach.status==='down')?`<div class="hint" style="margin-top:7px;color:var(--warn)">${gated?'有连不上的:多半是它依附的服务当前没在跑。<b>勾选过插件的群</b>那一轮会直接跳过不加载、服务起来后自动恢复;<b>没配过插件、按默认加载的群不会跳过</b>,每轮都替它付一次启动失败 —— 那类群去群卡保存一次勾选。':'有连不上的:多半是它依附的服务当前没在跑。这一套<b>全局加载、没有按群门控</b>,连不上会在每一轮里重试失败 —— 服务起不来就先从这里移除。'}</div>`:''}
      <div class="inline" style="gap:6px;margin-top:11px">
        <input id="${id}In" placeholder="${esc(ph)}" style="flex:1;min-width:0;font-size:11px;padding:6px 9px"/>
        <button class="btn" id="${id}Btn" style="padding:4px 15px;font-size:10.5px;white-space:nowrap;flex:none">添加</button></div>
      <div id="${id}Out" style="display:none;margin-top:6px"></div>
      <div class="hint" style="margin-top:7px">${help}</div>
    </div>`;
  const runLibCmd=async(id)=>{
    const inp=$('#'+id+'In'),btn=$('#'+id+'Btn'),out=$('#'+id+'Out');
    const cmd=inp.value.trim();if(!cmd){toast('先输入命令','err');return;}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    try{const rr=await api('/api/plugins/exec','POST',{command:cmd});
      out.style.display='block';out.innerHTML='<div class="reply '+(rr.ok?'':'err')+'" style="max-height:180px;overflow:auto">'+esc(rr.output)+'</div>';
      toast(rr.ok?'已执行':'执行失败(看输出)',rr.ok?'ok':'err');
      if(rr.ok){inp.value='';libRefresh();}
    }catch(e){toast(e.message,'err');}
    finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent='添加';}}};
  const libRefresh=()=>api('/api/plugins').then(r=>{
    const el=$('#plugLib');if(!el)return;
    const hasCodex=((S&&S.providers)||[]).some(p=>p.runner==='codex');
    const claudeSec=libSection('libClaude','Claude Code CLI','claude','~/.claude.json',(r.global&&r.global.mcp)||[],
      'claude mcp add --scope user 名 -- npx -y 包','装后到群卡「插件」<b>按群勾选</b>启用',true);
    const codexSec=hasCodex?libSection('libCodex','Codex CLI','codex','~/.codex/config.toml',(r.codex&&r.codex.mcp)||[],
      'codex mcp add 名 -- npx -y 包','<b>全局</b>对所有 codex 群生效(无按群门控)',false):'';
    // 两套 MCP 左右并排(cols2,窄屏自动堆叠);只有 Claude 时单卡限宽。
    el.innerHTML=codexSec?`<div class="grid cols2" style="gap:16px">${claudeSec}${codexSec}</div>`:`<div style="max-width:560px">${claudeSec}</div>`;
    for(const id of ['libClaude','libCodex']){const inp=$('#'+id+'In'),btn=$('#'+id+'Btn');if(!inp||!btn)continue;inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};btn.onclick=()=>runLibCmd(id);}
  }).catch(e=>{const el=$('#plugLib');if(el)el.innerHTML='<div class="reply err">'+IC.x+' '+esc(e.message)+'</div>';});
  libRefresh();
}

// unified add / edit model panel (⚙ on a card = edit; 添加模型 = add)
function openProviderModal(name,opts){
  opts=opts||{};
  const p=name?S.providers.find(x=>x.name===name):null, edit=!!p;
  // Codex CLI backend: 无 baseUrl / 无 key / 无 claude 思考深度,订阅登录。
  // 新建时由预设决定(选「GPT via Codex」⇒ 面板整个换形态,靠下面 apply() 里重开一次实现)——
  // 这些字段的**有无**是结构性的,不是显隐,拿 CSS 藏不干净。
  const isCodex=(edit&&p.runner==='codex')||(!edit&&!!opts.codex);
  const cxKey=edit?name:'codex'; // 登录态/额度是**机器级**的,新建时也能验(缓存键先用预设名)
  // Claude 订阅登录:不填端点、不填 key 就是它的正确形态(认证走本机 `claude auth login`)。
  // 官方 API key 按量计费明确不做(产品决定)⇒ 这两个字段对它只会误导,整块不显示。
  const isClaudeLogin=edit&&!isCodex&&!p.baseUrl;
  // ⚠ option 必须写 value:没有 value 时 select.value 读的是**显示文本**,而下面拿它当 PRESETS[key]
  //    查表 —— 界面语言一切成英文,选项文本变了,预设联动就整个失效(逻辑不许依赖显示文本)。
  const preset=edit?'':`<div class="field"><label class="f">预设(自动填端点/模型/调优)</label><select id="amPreset">${Object.keys(PRESETS).map(k=>`<option value="${esc(k)}" ${opts.preset===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>`;
  const keyPh=edit?(p.keyStatus==='set'?'已设置 · 留空保持':p.keyStatus==='env'?'env:'+esc(p.keyRef)+' · 留空保持':'粘贴 key'):'粘贴 key(存进本地 gitignored 配置)';
  const codexNote=isCodex?`<div class="dim" style="font-size:12px;line-height:1.55;margin:-2px 0 12px;padding:9px 11px;border:1px solid var(--line-hi);border-radius:8px"><b style="color:var(--ember)">Codex CLI 后端(GPT)</b> · 经 ChatGPT 订阅登录(<span class="mono">codex login</span>),<b>无 baseUrl、无 API key</b>。写文件权限由该群「执行模式」决定(bypassPermissions→可写)。额度与你交互式 Codex 共享,省着用。</div>`:'';
  $('#modal').innerHTML=`<h3>${edit?'配置 '+esc(name):'添加模型'}</h3>
    ${preset}
    ${codexNote}
    <div class="field"><label class="f">名称(唯一标识,英文)</label><input id="amName" value="${edit?esc(name):''}" placeholder="如 glm / my-model" ${edit?'disabled':''}/></div>
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">端点 baseUrl</label><input id="amBase" value="${edit?esc(p.baseUrl):''}" placeholder="https://.../anthropic"/></div>`}
    ${isCodex?`<div class="field"><label class="f">模型 model</label>
      <select id="amModelSel"><option value="${edit?esc(p.model):''}" selected>${edit&&p.model?esc(p.model):'(未设 — 用 codex 默认)'}</option></select>
      <input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 gpt-5.6-sol" style="display:none;margin-top:8px"/>
      <div class="hint" id="amModelSrc" style="margin-top:4px">加载模型列表…</div></div>`
    :isClaudeLogin?`<div class="field" id="clModelWrap"><label class="f">模型 model</label>
      <div class="hint">检测登录中…</div></div>`
    :`<div class="field"><label class="f">模型 model</label><input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 glm-5.2[1m]"/></div>`}
    ${isClaudeLogin?`<div class="field"><label class="f">Claude 订阅登录</label>
      <div id="clStatus" style="border:1px solid var(--line-hi);border-radius:8px;padding:9px 11px;font-size:13px">${clStatusHtml()}</div>
      <button class="btn" id="clVerify" style="margin-top:8px">检测登录</button>
      <div class="hint" style="margin-top:6px">读的是这台机器 <span class="mono">claude auth status</span> 的结果(不联网计费、不占订阅额度)。没登录就在这台机器上跑一次 <span class="mono">claude auth login</span>。</div></div>`:''}
    ${isCodex?`<div class="field"><label class="f">Codex 订阅登录 / 额度</label>
      <div id="cxStatus" style="border:1px solid var(--line-hi);border-radius:8px;padding:9px 11px;font-size:13px">${cxStatusHtml(cxKey)}</div>
      <button class="btn" id="cxVerify" style="margin-top:8px">验证登录 / 刷新额度</button>
      <div class="hint" style="margin-top:6px">额度 = 与你交互式 Codex 共享的订阅窗口剩余(窗口时长随官方口径,当前多为「周」)。查询不耗消息额度。</div></div>`:''}
    ${isCodex?`<div class="field"><label class="f">推理强度(model_reasoning_effort)</label><select id="amRE">${RE_CODEX.concat(edit&&p.reasoningEffort&&!RE_CODEX.includes(p.reasoningEffort)?[p.reasoningEffort]:[]).map(v=>`<option value="${v}" ${edit&&v===(p.reasoningEffort||'')?'selected':''}>${v||'默认(模型内置)'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:4px">低档更快省额度,高档更强更慢;编码/agentic 类任务 xhigh 通常是甜点档。选项随所选模型变化(默认走模型内置),逐轮生效、切即用。万一某档超出你的订阅套餐,运行时会被拒 → 自动去档重跑一轮,群里不会空等。</div></div>`:''}
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">API key</label><input id="amKey" placeholder="${keyPh}"/></div>`}
    ${isCodex?'':`<div class="field"><label class="f">思考深度(CLAUDE_CODE_EFFORT_LEVEL)</label><select id="amEff">${EFFORTS.map(v=>`<option value="${v}" ${edit&&v===p.effort?'selected':''}>${v||'默认'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:5px">低档更快更省,高档更强更慢。编码 / agentic 类任务 <b>xhigh</b> 通常是甜点档(也是 Claude Code 自己的默认)。</div></div>`}
    ${(isCodex||isClaudeLogin)?'':`<div class="inline" style="margin:2px 0 2px"><input type="checkbox" id="amVision" ${edit&&p.vision===false?'checked':''} style="width:auto"/> <span class="dim">此模型不支持识图(纯文本模型)</span></div>
      <div class="hint" style="margin:0 0 10px">勾选后,送给它的图片(群里发的图、网页截图、读取的图片文件)会自动降级成一句占位文本 —— 不勾则整轮会被模型以「只支持文本输入」打断。拿不准就先跑一轮试:报这个错就回来勾上。</div>`}
    ${edit?`<div class="inline" style="margin:2px 0 10px"><input type="checkbox" id="amHide" ${p.hidden?'checked':''} style="width:auto"/> <span class="dim">在列表中隐藏此模型</span></div>`:''}
    <div class="inline" style="justify-content:space-between;margin-top:8px">
      ${edit?'<button class="btn ghost" id="amDel">移除</button>':'<span></span>'}
      <div class="inline" style="gap:8px"><button class="btn" id="amCancel">取消</button><button class="btn primary" id="amSave">${edit?'保存':'添加'}</button></div></div>`;
  $('#modalBg').classList.add('show');
  if(!edit){const apply=()=>{const key=$('#amPreset').value,pr=PRESETS[key]||{};
    // ⚠ codex 形态是**结构性**的(没有端点/key/思考深度,多出模型下拉与订阅额度),
    //   靠显隐凑不出来 ⇒ 切换时原地重开一次面板,把选中的预设带过去。
    if(!!pr.runner!==!!isCodex){openProviderModal(null,{codex:pr.runner==='codex',preset:key});return;}
    const $b=$('#amBase'),$m=$('#amModel');

/* ── 风格图标 ────────────────────────────────────────────────────────────────
   服务端(src/design.js swatchLayout)算好的图元表 → SVG。这里**只做 rect → <rect> 的机械映射**:
   群里那张 PNG 走的是同一份 layout,一旦在这儿自己算坐标,两端就会各画各的 —— 而「控制台的图标
   和群里发出去的不一样」这种不一致,用户根本不会当成 bug 报上来。
   rx 要在这里 clamp:SVG 规范把 rx 收到 width/2、ry 收到 height/2 ⇒ 胶囊哨兵(9999)在宽扁的
   按钮上会渲成椭圆,而光栅器给的是两端半圆。取 min(r, w/2, h/2) 才和 PNG 一致。 */
let SWG=0; /* 渐变 id 计数:一页上会有十几张风格图,defs 的 id 重了后面那张会去用前面那张的渐变 */
function swatchSvg(lay,w,style){
  if(!lay||!lay.rects)return'';
  const h=Math.round(w*lay.h/lay.w);
  /* 渐变(v0.11.22):图元多带一个 grad 就画成线性渐变。角度公式与光栅那侧**同一个向量**
     (CSS 口径:0deg 自下而上、90deg 自左向右)—— 各写一份就会出现「控制台朝右下、群里朝右上」。 */
  let defs='';
  const fillOf=r=>{
    if(!r.grad)return esc(r.fill);
    const id='swg'+(++SWG),a=(Number(r.grad.angle)||0)*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a);
    defs+=`<linearGradient id="${id}" x1="${(.5-dx/2).toFixed(3)}" y1="${(.5-dy/2).toFixed(3)}" x2="${(.5+dx/2).toFixed(3)}" y2="${(.5+dy/2).toFixed(3)}">`
      +`<stop offset="0" stop-color="${esc(r.fill)}"/><stop offset="1" stop-color="${esc(r.grad.to)}"/></linearGradient>`;
    return `url(#${id})`;
  };
  const body=lay.rects.map(r=>{const rr=Math.min(r.r,r.w/2,r.h/2);const f=fillOf(r);
    return `<rect x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}"${rr>0?` rx="${rr.toFixed(2)}"`:''} fill="${f}"/>`;}).join('');
  return `<svg viewBox="0 0 ${lay.w} ${lay.h}" width="${w}" height="${h}" aria-hidden="true" style="display:block;flex:none;${style||''}">`
    +(defs?`<defs>${defs}</defs>`:'')+body+'</svg>';
}
/* 群卡「图标」行那排缩略图。⚠ **异步填充**:群卡是同步渲染的,先留空位、拉回来再填 ——
   把整块渲染卡在一个网络请求上,换来的是每次刷新群卡都要闪一下。
   ⚠ 同一份 svg 在两处按不同尺寸画(库里 22px / 群卡 18px):尺寸由外层格子定,svg 撑满它。 */
async function paintGroupIconStrips(){
  const slots=$$('#groups [data-sysstrip]'); if(!slots.length)return;
  const lib=await ensureIconLib();
  const by={}; for(const s of ((lib&&lib.systems)||[]))by[s.system]=s;
  for(const el of slots){
    const s=by[el.dataset.sysstrip];
    // 取不到就如实说,不留空排 —— 空排会被读成「这套系统没有图标」
    if(!s||!s.icons||!s.icons.length){el.innerHTML='<span class="hint" style="font-size:10px">样张取不到</span>';continue;}
    /* 按生效形态取样张。⚠ **「要实心但这套没有实心」必须当场说破**:那时真正取到的是线性
       (iconStyleGap 说的就是这条),界面若跟着声明画一排线性还标着「实心」,就成了
       「声明与事实不符」——本项目最贵的一类 bug,而且这行本来是用来看「现在长什么样」的。 */
    const wantFilled=el.dataset.sysstyle==='filled';
    const hasFilled=!!(s.filled&&s.filled.length);
    const use=wantFilled&&hasFilled?s.filled:s.icons;
    el.innerHTML=(wantFilled&&!hasFilled?'<span class="chip warn" style="flex:none" title="风格档/图标档声明的是实心,但这套系统没有实心目录 —— 实际取到的是下面这排线性图">这套没有实心</span>':'')
      +use.map(i=>`<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:18px;height:18px">${i.svg}</span>`).join('');
  }
  const box=$('#groups'); if(box)fitStrips(box);
}
/* 风格库(只读):内置预设 + ~/.sbot/design-styles 自定义。走独立 API 而不是塞进 /api/state ——
   它只在「群·项目」页要用,没必要让 15s 自动刷新的每次心跳都背着 8 份图元表。拉到就缓存,

/* 图标库(只读):代码里预先整理好的两套系统,**不开放自定义**(2026-08-25 拍板)。
   ⭐ 与设计风格库**平级** —— 它回答的是「图形从哪来、叫什么名」,风格回答「怎么画它」;
   一个项目分别选,换风格不该把图标一起换掉。
   ⚠ 每套配 8 个**真实渲染**的图标做样张:挑哪套是「认不认得出」的判断,断言判不了,
   必须按真实尺寸摆出来看(教训 31)。而这 8 个正是实测两库几何全不同的那几个 ——
   把它们并排放,「换一套到底换了什么」一眼就有答案。
   ⚠ 图标包不随产品分发(四套合计约 160MB) ⇒ 没装的如实标「未安装」,不留空白(空白会被读成「这套是空的」)。*/
let iconLib=null;
/* 取一次就缓存。⚠ 样张是**系统的属性、不是项目的属性** ⇒ 它不进 /api/state 那条 15s 心跳:
   塞进去就是每个绑定群每次心跳多读 8 个 svg、多背几 KB,而这份数据全部群共用同一套。
   群卡「图标」行那排缩略图因此也走这里,前端按系统名对上 —— 同一份数据两处用,服务端零额外开销。*/
async function ensureIconLib(){
  if(iconLib)return iconLib;
  try{iconLib=await api('/api/design/icons');}catch(e){iconLib=null;}
  return iconLib;
}
async function loadIconLib(){
  const box=$('#iconLib'); if(!box)return;

     名字必须跟着图走 —— 「换一套系统连叫法都变了」是这张卡最该传达的一件事,
     而只看图看不出 house / home 的区别。 */
  /* 一排样张:标签独立成行 + 图标**定宽格子**平铺。
     ⚠ 定宽是「按卡片宽度自适应」的前提 —— 格子等宽,能摆几个才算得出来;图标名因此从格子里
     撤掉(名字宽度各不相同,留着就没法算),改成行下面那句「叫法」,一行说清两套的差别。
     实际画几个由 fitStrips() 在**布局之后**按真实宽度决定(见下),这里先全画出来。 */
  const CELL=22, GAP=13;
  const strip=(label,icons,note)=>`
    <div style="margin-top:11px;min-width:0">
      <div class="hint" style="font-size:10px;opacity:.6;margin-bottom:6px">${label}</div>
      ${icons.length
        ? `<div class="iconstrip inline" data-cell="${CELL}" data-gap="${GAP}" style="gap:${GAP}px;flex-wrap:nowrap;overflow:hidden;color:var(--ink);min-width:0">${icons.map(i=>
            `<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:${CELL}px;height:${CELL}px">${i.svg}</span>`).join('')}</div>`
        : `<span class="hint faint" style="font-size:10.5px">${note}</span>`}
    </div>`;
  /* 叫法那一句:同一个语义在两套系统里叫什么。**这是「换一套等于换一整套名字」的证据**,
     从格子里撤掉名字后由它承担。只挑差得最明显的三个,多了就成噪音。 */
  const naming=s=>{const pick=['more','home','delete'].map(k=>(s.icons.find(i=>i.sem===k)||{}).name).filter(Boolean);
    return pick.length?`<div class="hint faint" style="margin-top:9px;font-size:10px">叫法:${pick.map(esc).join(' · ')}</div>`:'';};
  const card=s=>`
    <div class="card" style="padding:15px 16px;min-width:0">
      <div class="inline" style="gap:8px;align-items:baseline;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:600">${esc(s.label)}</span>
        ${s.installed?`<span class="hint" style="font-size:10.5px">${s.count?esc(String(s.count))+' 个图标 · ':''}语义名 ${s.semantics} 条${s.fallbackLibrary?' · 兜底 '+esc((iconLib.systems.find(x=>x.library===s.fallbackLibrary)||{}).label||s.fallbackLibrary):''}</span>`
          :'<span class="chip warn" title="这套的图标包没装在这台机器上(几个包合计约 160MB,不随产品分发)—— 别的功能不受影响,但选了它取图标会取不到。装一次即可">未安装</span>'}
      </div>
      ${s.installed
        ? strip('线性',s.icons,'')+strip('实心',s.styles.includes('filled')?s.filled:[],'这套没有实心 —— 要实心得选另一套')+naming(s)
        : `<div class="hint faint" style="margin-top:10px;font-size:10.5px">装上 ${esc(s.pkg)} 后这里会出样张</div>`}
    </div>`;
  box.innerHTML=`<div class="grid cols2 stagger">${(iconLib.systems||[]).map(card).join('')}</div>`
    +`<div class="hint faint" style="margin:12px 2px 0">每套的画法<b>逐个都不一样</b>,连叫法都不同(同一个「更多」:more-horizontal / dots / dots-three)—— 换一套是换一整套图形和名字,不是换个皮肤。已选的那套写在项目里,跟着代码走</div>`;

/* 一行画几个图标 —— **按卡片实际宽度算,不写死个数**。
   ⚠ 只能在布局之后量:innerHTML 刚写完时 clientWidth 是最终值(同步布局),但窗口一变、
   侧边一收,同一张卡的宽度就变了 ⇒ 必须挂 ResizeObserver 跟着重算,否则窄屏下这排图会被
   `overflow:hidden` 齐刷刷切掉半个图标(比少画几个难看得多)。
   ⚠ 同一张卡的线性排与实心排取**同一个 n**:两排是要逐列对照看的,各算各的就错位了。 */
function fitStrips(box){
  // ⚠ **观察这一排本身,不是外面的卡片** —— 实测:把容器压窄时,这一排从 306px 掉到 53px,
  //   而挂在卡片上的 ResizeObserver **一次都没触发**(卡片宽度没变,变的是排内可用空间)。
  //   判据挂错对象的表现是「窄屏下图标被 overflow:hidden 切掉半个」,而那比少画几个难看得多。
  const calc=(s)=>{
    const w=s.clientWidth; if(!w)return; // 页面还没显示时宽度为 0:先不动,等 RO 拿到真实宽度再算
    // 格子尺寸**每排自带**:图标库那张卡 22px,群卡缩到 18px —— 写死一个常量必然有一处算错
    const CELL=+(s.dataset.cell||22), GAP=+(s.dataset.gap||13);
    const n=Math.max(1,Math.floor((w+GAP)/(CELL+GAP))); // 最后一个格子后面不占 gap
    [...s.children].forEach((el,i)=>{el.style.display=i<n?'':'none';});
  };
  const strips=[...box.querySelectorAll('.iconstrip')];
  strips.forEach(calc);
  // ⚠ **不能只靠 ResizeObserver**:实测这页上它连初次回调都不给(卡片 454→206、这一排 279→58,
  //   两个 RO 各 0 次)。⇒ 关键时刻**确定性地重算一次**:刚画完时页面可能还没显示(宽度为 0),
  //   下一帧再补一次;切页与改窗口大小各再算一次。RO 留着当锦上添花,不当依靠。
  requestAnimationFrame(() => strips.forEach(calc))
  if(window.ResizeObserver){
    const ro=new ResizeObserver(es=>{for(const e of es)calc(e.target);});
    strips.forEach(s=>ro.observe(s));
    if(box._iconRO)box._iconRO.disconnect(); // 重画时把上一批观察者收掉,别越攒越多
    box._iconRO=ro;
  }
  if(!window._iconFitBound){ // 只绑一次:每次重画都绑会越攒越多
    window._iconFitBound=1
    let t=0
    addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(refitAllStrips,120)})
  }
}
// 全部样张排重算一次。切页 / 改窗口大小 / 数据到齐后各调一次 —— 这三处正是「刚画的时候宽度还不对」
// 的全部来源,而宽度不对的表现是被 overflow:hidden 切掉半个图标。
function refitAllStrips(){for(const id of ['#iconLib','#groups']){const b=$(id);if(b)fitStrips(b);}}
/* 风格库(只读):内置预设 + ~/.sbot/design-styles 自定义。 */
let styleLib=null;
async function loadStyleLib(){
  const box=$('#styleLib'); if(!box)return;
  if(styleLib){paintStyleLib();return;}
  try{const _r=await api('/api/design/styles');styleLib=_r;paintStyleLib();}
  catch(e){box.innerHTML=`<div class="card"><div class="hint">风格库读取失败:${esc(e.message)}</div></div>`;}
}
function paintStyleLib(){
  const box=$('#styleLib'); if(!box||!styleLib)return;
  // 特征标签只标「有性格」的信号:衬线/深色/等宽/圆角值 —— 「无衬线」「直角」是大多数的常态,
  // 8 张卡有 6 张挂同一个标签就成噪音了(常态不用说,例外才值得标)。
  const feat=s=>[s.source==='user'?'<span class="tag">自定义</span>':'',
    /* 载体单独一枚驼色标(v0.11.22):它不是「特征」而是**分类** —— 标了就说明这套只服务
       那种载体,是挑档时第一眼要看的东西。绝大多数风格不标(通用),所以它一出现就有信息量。 */
    s.platform?`<span class="chip tan" title="这套风格是按这个载体定的(小程序与后台网站的圆角、间距、字号本就不该一样)">${esc(s.platform)}</span>`:'',
    s.dark?'<span class="chip cap" title="底色为深色">深色</span>':'',
    s.serif?`<span class="chip cap" title="${esc(s.fontStack||'')}">衬线</span>`:'',
    s.mono?'<span class="chip cap" title="字体族里有等宽(代码/数据)">等宽</span>':'',
    /* ⚠ 只标**不走常规那一路**的那几套(裁决在服务端 cjkState 三态,别在这儿判)——
       那个词的权威在 design.js 的 CJK_KIND_RE,前端抄一份必然漂移。常规那路是压倒性
       常态:18 张卡 12 张,标了就违反上面那条「常态不用说」,还把该看见的 6 张淹掉。
       第三态「未声明」是给自建档留的防线:v0.11.65 曾把它与「走黑体」合成同一个不标。 */
    s.cjkState==='exception'?`<span class="chip cap" title="这套风格的汉字不走黑体那条常规路(混用时按出现顺序列出)· 没有这枚标签 = 走系统黑体">中文${esc((s.cjkKinds||[]).join('·'))}</span>`
      :s.cjkState==='missing'?`<span class="chip cap" title="这份档写了字体,但栈里一个中文族都没有 —— 汉字会掉到浏览器默认字体,不受这套风格控制(纯英文产品可忽略)">中文未声明</span>`:'',
    s.radius>=100?'<span class="chip cap">胶囊圆角</span>':(s.radius>0?`<span class="chip cap">圆角 ${s.radius}px</span>`:''),
    /* ⚠ 这里**故意不标图标库**(2026-08-25 拿掉了 v0.11.52 那枚 chip):图标库与设计风格
       **平级** —— 用哪套图标是**项目**的选择(见下面「图标库」那一节 + 群卡的「图标」行),
       不是这份风格档的属性。在风格卡上标「图标 tabler」会让人以为换风格就换图标,
       而那正是要拆开的绑定。风格只管**怎么画**图标,那是下面这枚描边标签。 */
    s.icons&&s.icons.strokeWidth?`<span class="chip cap" title="${esc('这套风格里图标的画法:'+(s.icons.style==='filled'?'实心':'线性')+' · 描边 '+s.icons.strokeWidth+' · 端点 '+(s.icons.linecap||'round')+(s.icons.sizes?' · 尺寸档 '+s.icons.sizes+' 个':'')+'。图形从哪来是另一件事,由项目的图标系统决定')}">图标描边 ${esc(String(s.icons.strokeWidth))}</span>`:''].filter(Boolean).join('');
  const card=s=>{const ft=feat(s);return `
    <div class="card" style="padding:15px 16px;min-width:0" data-slug="${esc(s.slug)}">
      <div class="inline" style="gap:14px;align-items:flex-start">
        ${swatchSvg(s.layout,106)}
        <div style="min-width:0;flex:1">
          <div class="inline" style="gap:7px;align-items:baseline;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">${esc(s.name||s.slug)}</span>${ft}</div>
          <div class="hint" style="margin-top:5px;line-height:1.65">${esc(s.description||'—')}</div>
          ${s.suits?`<div class="hint" style="margin-top:5px;opacity:.8">适合 · ${esc(s.suits)}</div>`:''}
          <div class="inline" style="gap:4px;flex-wrap:wrap;margin-top:9px">${(s.palette||[]).map(c=>
            `<span title="${esc(c.key)}: ${esc(c.hex)}" style="width:13px;height:13px;border-radius:3px;background:${esc(c.hex)};box-shadow:inset 0 0 0 1px var(--line);flex:none"></span>`).join('')}</div>
          <div class="inline" style="gap:6px;flex-wrap:wrap;margin-top:10px">
            ${s.source==='user'?`<button class="btn primary" data-styleedit="${esc(s.slug)}" title="改这一套本身(存回同一个名字)—— 正文默认原样保留,除非你勾「按新设定重写正文」" style="padding:2px 9px;font-size:10.5px">修改</button>`:''}
            <button class="btn" data-styledup="${esc(s.slug)}" title="以这一套为起点建一个**新的**:色板、圆角、字重都预填好,改成自己的即可(原来那套不动)" style="padding:2px 9px;font-size:10.5px">复制为新款</button>
            ${s.source==='user'?`<button class="btn ghost" data-styledel="${esc(s.slug)}" title="从风格库移除这一套(只删自己建的)" style="padding:2px 9px;font-size:10.5px">删除</button>`:''}
          </div>
        </div></div>
    </div>`;};
  /* 自定义排最前,并与内置预设**分成两块** —— 库里内置十几种,自己建的那两三套按字母混在
     中间就得逐个找,而它们恰恰是最常用的。次序由服务端 listStyles 定(同一份也管 CLI 那侧的
     组内先后),这里只按 source 切块,前端不自己排。
     ⚠ 分组标题只在**有**自定义时才出现:一套都没有时,孤零零一个「内置预设」标题是纯噪音
     —— 与上面特征标签同一条判据:常态不用说,例外才值得标。 */
  const all=styleLib.styles||[];
  const mine=all.filter(s=>s.source==='user'),stock=all.filter(s=>s.source!=='user');
  const grid=arr=>`<div class="grid cols2 stagger">${arr.map(card).join('')}</div>`;
  const head=(label,n,note,top)=>`<div class="inline" style="gap:9px;align-items:baseline;margin:${top}px 2px 10px">
      <span style="font-size:12.5px;font-weight:600;color:var(--ink)">${label}</span>
      <span class="hint">${n} 套${note?' · '+note:''}</span></div>`;
  const body=!all.length?'<div class="empty">风格库是空的</div>'
    :!mine.length?grid(stock)
    :head('自定义',mine.length,'这台机器上配的 · 全部群都能用',0)+grid(mine)+head('内置预设',stock.length,'',26)+grid(stock);
  box.innerHTML=body+`
    <div class="hint faint" style="margin:12px 2px 0">「${IC.plus} 新建风格」配一套自己的(比如把公司品牌色配成一款)· 已经在某个项目里打磨好的那份,可在「群·项目」页那个群的「设计风格」行收录进来</div>`;
  /* 卡片动作走事件委托:整块会被「重新扫描 / 保存 / 删除」反复重画,逐个 onclick 绑定
     每次都要重来一遍,而委托只绑一次在容器上(容器本身不重建)。 */
  box.onclick=async(e)=>{
    /* 修改 = 改这一套本身(存回同一个 slug);复制为新款 = 拿它当起点建**另**一套。
       两者预填数据同源,差别全在 openStyleModal 的模式上。 */
    const ed=e.target.closest('[data-styleedit]');
    if(ed){const s=(styleLib.styles||[]).find(x=>x.slug===ed.dataset.styleedit);if(s)openStyleModal(s.form||null,{edit:s});return;}
    const dup=e.target.closest('[data-styledup]');
    if(dup){const s=(styleLib.styles||[]).find(x=>x.slug===dup.dataset.styledup);if(s)openStyleModal(s.form||null,{from:s});return;}
    const del=e.target.closest('[data-styledel]');
    if(!del)return;
    const slug=del.dataset.styledel;
    const s=(styleLib.styles||[]).find(x=>x.slug===slug);
    if(!confirm('从风格库移除「'+((s&&s.name)||slug)+'」?\n项目里已经用上它的那些不受影响。'))return;
    del.disabled=true;
    try{const r=await api('/api/design/styles','DELETE',{slug});
      styleLib=null;await loadStyleLib();
      toast(r.revertedToBuiltin?'已移除 · 同名的内置风格重新可用':'已从风格库移除','ok');
    }catch(err){toast(err.message,'err');if(document.body.contains(del))del.disabled=false;}
  };
}

/* ── 新建 / 复制自定义风格 ────────────────────────────────────────────────────
   为什么是「配一套」而不是「传一份文档」:operator 手里有品牌色和对气质的直觉,没有一份写好的
   规范 —— 那套 front matter 格式是实现细节,不该要求人手写。所以入口是六项表单,系统去编档。
   右列**实时预览**是这张表单的全部价值所在:每一项都对应预览图上的一条通道,改哪儿图上立刻变哪儿。
   ⚠ 预览图元一律由服务端算(POST /api/design/preview → 现成的 swatchSvg 画)—— 布局逻辑只许
   有一份,前端自己算坐标就会和群里发出去的那张 PNG 长得不一样,而这种不一致没人会当 bug 报。 */
const NS_SCENES=['内容阅读','品牌门面','工具产品','活动推广','生图插画'];
/* 载体与场景是两个轴:场景答「做什么」、载体答「在哪儿看」。留空 = 载体无关(常态)。
   ⚠ 词表与服务端 design.js 的 PLATFORM_WORDS 必须一致 —— 那侧是权威(落盘校验按它);
   这里多一个词,人挑得到却存不进去。 */
const NS_PLATFORMS=['小程序','后台网站','网页前台','移动 App','印刷物料'];
const NS_ROUNDS=[['sharp','直角'],['subtle','微圆'],['soft','柔圆'],['pill','胶囊']];
/* 三样有预览通道的属性(v0.11.22)。⚠ 档位 id 与服务端 ELEV_LEVELS / STATUS_KEYS 必须一致 ——
   那侧是权威(落盘校验按它),这边多一个档,人选得到却存不进去。 */
const NS_ELEVS=[['none','无'],['flat','轻'],['soft','明显'],['color','彩色']];
const NS_STATUS=[['success','成功'],['warning','警告'],['danger','危险']];
const /* ⚠ 三个默认值必须过 WCAG AA 正文(配白底 ≥4.5:1)—— 它们会直接落进用户建的档,
   而 `design doctor` 会把不达标的报成硬问题 ⇒ 那个项目此后每次交付都多一行常驻噪音。
   审计实测:旧值 warning #D4A017 = 2.38:1 · danger #E53935 = 4.23:1,两个都不达标。
   新值同色相压明度(#B45309 = 5.02 · #C62828 = 5.62),不是另挑一个能过线的颜色。 */
NS_STATUS_DEF={success:'#2E7D32',warning:'#B45309',danger:'#C62828'};
const NS_WEIGHTS=[['light','轻'],['medium','中'],['heavy','重']];
/* ⚠ 字体不在表单里选(2026-09-02 产品决定去掉整个「字体」栏):中文字体是低频决定,占一格不值;
   要换字体在群里说一句更省事。生成的档恒定用一套**系统字体优先**的栈,见服务端 SANS_STACK。
   ⚠ 手写的内置档不受此限 —— 新中式该用宋体、precision-mono 该用等宽,那是它们的设计身份。 */
const NS_CKEYS=[['bg','底色'],['ink','文字'],['accent','强调'],['muted','次要']];
const NS_BLANK={name:'',description:'',suits:[],platforms:[],colors:{bg:'#FFFFFF',ink:'#1A1D24',accent:'#6D28D9',muted:'#6B7280'},rounded:'subtle',weight:'medium',elevation:'flat',gradientTo:'',statusColors:null};
let nsTimer=null,nsSeq=0;
/* 提炼带回来的两样东西,存在这里而不是 DOM 上:
   nsExtra = 补充色 [{hex,count,on}](勾选态就是 on) · nsTokens = 字距/描边/间距/字号/行高
   两者都随 nsReadForm() 一起进预览与保存;弹窗每次打开都重置(见 openStyleModal)。 */
let nsExtra=[],nsTokens=null,nsSug=null;
/* 标识的形状。**本文件里只此一份** —— 建风格、收录、由名称推标识三处原本各写一份同样的
   字面量,改一处漏两处是迟早的事。(与服务端 design.js 那份跨端重复是架构现状,不在这里解) */
const NS_SLUG_RE=/^[a-z0-9][a-z0-9-]{0,40}$/;
/* 颜色文本框的归一,与服务端 _normHex 同判:#abc 展开成 #AABBCC,认不出返回 null。
   ⚠ 认不出时**不许**静默退回取色器的现值 —— 那等于替用户存下一个他没打算要的颜色,
   而且全程零提示(v0.11.21 审查)。归一给预览用,拦截在保存那一步。 */
const NS_HEX_RE=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
function nsNormHex(v){
  const m=NS_HEX_RE.exec(String(v==null?'':v).trim());
  if(!m)return null;
  const h=m[1];
  return '#'+(h.length===3?h[0]+h[0]+h[1]+h[1]+h[2]+h[2]:h).toUpperCase();
}
/* 压深一个色(勾上「用渐变」时给的起点值)。只服务这一个交互 —— 落盘的渐变两端色以表单为准,
   服务端不做任何派生,所以这里算得糙一点也不会让档和图对不上。 */
function nsDarken(hex,t){
  const n=nsNormHex(hex);if(!n)return'#000000';
  const c=[1,3,5].map(i=>parseInt(n.slice(i,i+2),16));
  return '#'+c.map(v=>Math.round(v*(1-t)).toString(16).padStart(2,'0')).join('').toUpperCase();
}
/* 四个色框逐个查,返回第一处非法的标签(全合法 ⇒ null)。红字提示与保存拦截共用它。 */
function nsHexCheck(){
  let bad=null;
  for(const [k,l] of NS_CKEYS){
    const t=$('#nsHex_'+k);if(!t)continue;
    const ok=!!nsNormHex(t.value);
    t.style.borderColor=ok?'':'var(--fail)';
    if(!ok&&!bad)bad=l;
  }
  const el=$('#nsColErr');
  if(el){
    el.style.display=bad?'block':'none';
    el.innerHTML=bad?'<span style="color:var(--fail)">'+bad+'不是合法的颜色值 —— 写成 #RRGGBB 或 #RGB;没改对之前存不进去</span>':'';
  }
  return bad;

/* 名称 → 建议标识。只在名称是纯 ASCII 时给得出(中文名转不出有意义的拼写,不硬转) */
function nsSuggestSlug(name){
  const s=String(name||'').trim().toLowerCase();
  if(!s||!/^[\x20-\x7e]+$/.test(s))return'';
  const out=s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,41).replace(/-+$/,'');
  return NS_SLUG_RE.test(out)?out:'';
}
function nsReadForm(){
  const colors={};
  for(const [k] of NS_CKEYS){
    const t=$('#nsHex_'+k),c=$('#nsCol_'+k),v=(t?t.value:'').trim();
    /* 预览期间可以拿取色器的现值顶上(边填边看不该中途黑屏),但这条路进不了保存 ——
       nsSave 会先跑 nsHexCheck 把非法值拦下来 */
    colors[k]=nsNormHex(v)||(c?c.value.toUpperCase():'#000000');
  }
  const on=(sel,def)=>{const b=$(sel+' .on');return b?b.dataset.v:def;};
  return {name:$('#nsName').value,description:$('#nsDesc').value,
    suits:$$('#nsSuits .nschk.on').map(e=>e.dataset.v),
    platforms:$$('#nsPlats .nschk.on').map(e=>e.dataset.v),
    colors,rounded:on('#nsRound','subtle'),weight:on('#nsWeight','medium'),
    elevation:on('#nsElev','flat'),
    /* 勾掉即当场清空(不是留着上次填的值不写)—— 所见即所存,与补充色那条同一口径 */
    gradientTo:$('#nsGradOn').checked?(nsNormHex($('#nsGradHex').value)||$('#nsGradCol').value.toUpperCase()):'',
    statusColors:$('#nsStatOn').checked
      ?NS_STATUS.reduce((o,[k])=>{o[k]=nsNormHex($('#nsStHex_'+k).value)||$('#nsSt_'+k).value.toUpperCase();return o;},{})
      :null,
    /* 勾掉的补充色**当场从表单里消失** —— 预览的色板条会少一格,所见即所存 */
    extraColors:nsExtra.filter(x=>x.on).map(x=>x.hex),
    extraTokens:nsTokens||{}};
}
function nsPreview(){
  clearTimeout(nsTimer);
  nsTimer=setTimeout(async()=>{
    const my=++nsSeq, form=nsReadForm();

/* 提炼回填:只覆盖「参考里读得出来」的那几项(色板/衬线/等宽/圆角),名称与描述留着不动 ——
   那两项是人写的,被一次提炼冲掉最恼人。 */
function nsFill(f){
  if(!f)return;
  for(const [k] of NS_CKEYS){const v=nsNormHex((f.colors||{})[k]);if(!v)continue;
    $('#nsCol_'+k).value=v;$('#nsHex_'+k).value=v;}
  $$('#nsRound button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.rounded));
  $$('#nsWeight button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.weight));
  /* ⚠ 字体不在表单里,提炼回填也就无从谈起(提色器本来也读不出中文族) */
  nsHexCheck();
}
/* 提炼带回来的三样属性(v0.11.22)。同一条纪律:**提不出的项一概不动表单** ——
   traits 里没有的键就是「这份参考里读不出来」,不是「读到了 0」。 */
function nsFillTraits(tr){
  if(!tr)return;
  if(tr.elevation)$$('#nsElev button').forEach(b=>b.classList.toggle('on',b.dataset.v===tr.elevation));
  if(tr.gradientTo){const v=nsNormHex(tr.gradientTo);
    if(v){$('#nsGradOn').checked=true;$('#nsGradWrap').style.display='block';$('#nsGradCol').value=v;$('#nsGradHex').value=v;}}
  if(tr.statusColors&&Object.keys(tr.statusColors).length){
    $('#nsStatOn').checked=true;$('#nsStatWrap').style.display='block';
    /* 只填提到的槽:参考里只声明了 danger 的站点,另外两个保持默认值而不是被编出来 ——
       但三个格子都会随勾选一起存进档,所以提示文案里说清「没提到的是默认值,自己改」 */
    for(const [k] of NS_STATUS){const v=nsNormHex(tr.statusColors[k]);if(!v)continue;
      $('#nsSt_'+k).value=v;$('#nsStHex_'+k).value=v;}}
}
/* 提炼带回来的建议落进本地状态。两条纪律:
   ① 描述框**空着才自动填** —— 已经写了字的绝不冲掉(那是人写的,被一次提炼抹掉最恼人);
      想换成这句,证据区那颗「用这句」点一下。
   ② 名称一律不动。 */
function nsApplySuggest(sug){
  nsExtra=[];nsTokens=null;nsSug=sug||null;
  /* 「复制为新款」带进来的那块补充色到此作废(nsExtra 已被这次提炼整个换掉)——
     留着它就是一排点不动、又与实际状态对不上的色块,而且会与证据区撞 id */
  const cb=$('#nsCopyExtra');if(cb)cb.remove();
  if(!sug)return;
  nsExtra=(sug.extraColors||[]).map(c=>({hex:(c&&c.hex)||c,count:(c&&c.count)||0,on:true}));
  nsTokens=(sug.extraTokens&&Object.keys(sug.extraTokens).length)?sug.extraTokens:null;

/* 「还读到」那一行:只列真读出来的项,一项都没有就整行不出现(不写「未读到字距」这种废话) */
function nsTokensSummary(t){
  if(!t)return'';
  const p=[];
  if(t.letterSpacing!=null)p.push('字距 '+t.letterSpacing+'em');
  if(t.borderWidth!=null)p.push('描边 '+t.borderWidth+'px');
  if(t.spacingUnit!=null)p.push('间距 '+t.spacingUnit+'px 网格');
  if(t.headlineSize!=null&&t.bodySize!=null)p.push('标题/正文 '+t.headlineSize+'/'+t.bodySize);
  if(t.lineHeight!=null)p.push('行高 '+t.lineHeight);
  return p.join(' · ');
}
/* 可勾选补充色块的骨架。**证据区与「复制为新款」共用同一份** —— 两处各写一份,勾选逻辑
   迟早只改一处。容器 id 由调用方给:证据区每次提炼都整块重画,不能与复制块撞 id。 */
function nsChipsHtml(id){
  return '<span id="'+id+'" class="nschips" style="display:inline-flex;vertical-align:-4px;margin-left:2px">'
    +nsExtra.map((c,i)=>`<span class="nschk${c.on?' on':''}" data-i="${i}"><span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)}${c.count?'<span class="faint"> ×'+c.count+'</span>':''}</span>`).join('')+'</span>';
}

function nsBindChips(id){
  $$('#'+id+' .nschk').forEach(c=>c.onclick=()=>{

}
function nsEvidence(ev){

  else if(ev.source==='url')rows.push('读了 '+(ev.sheets||0)+' 份样式表');
  else if(ev.source==='dir')rows.push('扫了 '+(ev.files||0)+' 个样式文件');
  const sw=(ev.colors||[]).map(c=>`<span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)}${c.count?'<span class="faint"> ×'+c.count+'</span>':(c.role?'<span class="faint"> '+esc(c.role)+'</span>':'')}`).join('　');
  if(sw)rows.push('提到最多的颜色 · '+sw);
  if((ev.fonts||[]).length)rows.push('字体族 · '+ev.fonts.map(f=>esc(f)).join(' / '));
  if((ev.radii||[]).length)rows.push('圆角取值 · '+ev.radii.join(' / ')+'px');
  else if(ev.roundedFound===false)rows.push('没读到圆角设定,先按「微圆」给');

  if(ts)rows.push('还读到 · '+ts);

  const tr=(nsSug&&nsSug.traits)||{};
  const trs=[];
  if(tr.elevation)trs.push('投影 '+({none:'一处都没有 ⇒ 无',flat:'很浅 ⇒ 轻',soft:'明显',color:'带颜色 ⇒ 彩色'}[tr.elevation]||tr.elevation));
  if(tr.gradientTo)trs.push('渐变到 <span class="sw" style="background:'+esc(tr.gradientTo)+'"></span>'+esc(tr.gradientTo));
  if(tr.statusColors)trs.push('状态色 '+Object.keys(tr.statusColors).map(k=>({success:'成功',warning:'警告',danger:'危险'}[k]||k)+' <span class="sw" style="background:'+esc(tr.statusColors[k])+'"></span>').join(' '));
  if(trs.length)rows.push('还读到 · '+trs.join(' · ')+'<span class="faint">(没提到的那几样保持原样)</span>');
  if(nsExtra.length)rows.push('补充色(勾上的会一起写进这套风格)· '+nsChipsHtml('nsExtraChips'));
  if(nsSug&&nsSug.description)rows.push('这一句只说事实,可以直接当描述 · <span class="dim">'+esc(nsSug.description)
    +'</span> <button type="button" class="btn nsmini" id="nsUseDesc">用这句</button>');
  rows.push('<span class="faint">这是起点不是结论 —— 逐项改到满意为止</span>');

  const nsDir=$('#nsRefDir');if(nsDir)nsDir.onclick=()=>openFsPicker((p)=>{if(p){$('#nsRef').value=p;$('#nsExtract').click();}});
  $('#nsExtract').onclick=async()=>{
    const ref=$('#nsRef').value.trim();
    if(!ref){toast('先填一个网址,或本机上项目所在目录的绝对路径','err');return;}
    const b=$('#nsExtract');b.disabled=true;const old=b.textContent;b.innerHTML='<span class="spin"></span>';
    /* 顺序要紧:先把建议收进状态(nsApplySuggest),证据区才画得出补充色勾选与那句描述 */
    try{const r=await api('/api/design/extract','POST',{ref});nsFill(r.form);nsFillTraits(r.suggest&&r.suggest.traits);nsApplySuggest(r.suggest);nsEvidence(r.evidence);nsPreview();
      toast('已给出一套起点 —— 逐项改到满意为止','ok');}
    catch(e){toast(e.message,'err');}
    finally{if(document.body.contains(b)){b.disabled=false;b.textContent=old;}}
  };
  $('#nsSave').onclick=async()=>{
    /* 先归一(#abc → #AABBCC)再拦:非法值不许带着取色器的旧值溜进保存 */
    for(const [k] of NS_CKEYS){const t=$('#nsHex_'+k),n=t&&nsNormHex(t.value);if(n)t.value=n;}
    const bad=nsHexCheck();
    if(bad){toast(bad+'不是合法的颜色值 —— 写成 #RRGGBB 或 #RGB','err');const t=$('#nsHex_'+(NS_CKEYS.find(([,l])=>l===bad)||[])[0]);if(t)t.focus();return;}
    const b=$('#nsSave');b.disabled=true;const old=b.textContent;b.innerHTML='<span class="spin"></span>';
    /* 修改模式:恒覆盖同一个 slug(这就是「改这一套」的语义),正文去留由那个勾选决定。
       ⚠ 结果文案必须点明正文被怎么处理了 —— 不说的话,人以为只动了颜色,其实骨架被重写了。 */
    const editing=!!opt.edit, rewrite=editing&&$('#nsRewrite')&&$('#nsRewrite').checked;
    try{const r=await api('/api/design/styles','POST',{form:nsReadForm(),slug:$('#nsSlug').value.trim(),
        overwrite:editing?true:$('#nsOver').checked, keepProse:editing&&!rewrite});
      closeModal();styleLib=null;await loadStyleLib();
      toast(editing
        ?('已保存修改 · '+(rewrite?'正文已按新设定重写':'正文保持原样(里面写死的色值记得核对)'))
        :('已存入风格库,全部群都能用'+(r.shadowed?'(它盖住了同名的内置风格)':'')+' · 细则可以在群里让它按这份骨架接着补'),'ok');}
    catch(e){toast(e.message,'err');if(document.body.contains(b)){b.disabled=false;b.textContent=old;}}
  };
  nsPreview();
}
/* 把某个群项目里打磨好的那份风格档收录进全局库(复制,不动项目里那份) */

    <div class="inline" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="clCancel">取消</button><button class="btn primary" id="clGo">收录</button></div>`;

    const el=$('#clHint'),v=$('#clSlug').value.trim();

    if(!v||!NS_SLUG_RE.test(v)){el.innerHTML=v?'<span style="color:var(--fail)">只能用小写字母、数字与连字符,首位是字母或数字</span>':'存进库后就用它来指代这一套';return;}
    if(hit&&hit.source==='user')el.innerHTML='<span style="color:var(--risk,var(--fail))">库里已经有同名的「'+esc(hit.name||v)+'」—— 要替换掉它,请勾下面那项</span>';
    else if(hit)el.innerHTML='与内置的「'+esc(hit.name||v)+'」同名 —— 存下去会盖住它';
    else el.innerHTML='存进库后就用它来指代这一套';

  $('#clSlug').oninput=hint;

  $('#clGo').onclick=async()=>{
    const b=$('#clGo');b.disabled=true;const old=b.textContent;b.innerHTML='<span class="spin"></span>';
    try{await api('/api/design/collect','POST',{chatId,rel:relPick,slug:$('#clSlug').value.trim(),name:$('#clName').value.trim(),overwrite:$('#clOver').checked});
      closeModal();styleLib=null;
      if($('#styleLib'))await loadStyleLib();
      toast('已收录进风格库,全部群都能挑到它','ok');}
    catch(e){toast(e.message,'err');if(document.body.contains(b)){b.disabled=false;b.textContent=old;}}
  };
}

/* 展开着的定时任务详情(按 cron id)。必须存在渲染之外 —— 启停任务、切页签回来、群卡上任何
   写操作都会 renderGroups() 重画整块,不记住的话每点一次启停,正读着的全文就没了。 */
const cronOpen=new Set();
/* 任务正文的轻量分层。不做 markdown 解析,只认这个产品自己的体裁约定:①②③ 起步骤 ·
   「· 」起条目 · ⚠ 起提醒 · 缩进两格是命令或样例。认不出的行一律当普通段落 —— 所以随手写的
   任务照样正常显示,分层是锦上添花而不是解析器,不会因为格式不合就渲染坏。 */
function cronFullHtml(text){
  // ⚠ 在正文里三种位置都出现(独立成行 / 挂在条目开头 / 夹在句子中间),只按行首判断会漏掉
  // 后一种 —— 实测这份任务 4 个 ⚠ 里就有 2 个夹在句中,而它们恰恰是最该跳出来的。
  // 所以位置分层之外,再把符号本身标一下,三种位置就都覆盖了。
  const E=s=>esc(s).replace(/⚠/g,'<b class="cw">'+IC.warn+'</b>');
  return String(text||'').split('\n').map((ln,i)=>{
    if(!ln.trim())return '<div class="cbl-sp"></div>';
    if(/^\s{2,}\S/.test(ln))return `<div class="cbl-code">${esc(ln.trim())}</div>`;   // 缩进行 = 命令/样例,原样不加标记
    const t=ln.trim();
    if(i===0)return `<div class="cbl-t">${E(t)}</div>`;                               // 首行 = 任务名
    if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t))return `<div class="cbl-h">${E(t)}</div>`;
    if(/^⚠/.test(t))return `<div class="cbl-warn">${E(t)}</div>`;
    // 条目:剥掉「· 」再判断 —— 有的提醒写成「· ⚠ …」挂在条目上,不先剥就落进普通条目、警示性丢失
    if(/^[·•]\s*/.test(t)){const b=t.replace(/^[·•]\s*/,'');return `<div class="cbl-li${/^⚠/.test(b)?' warn':''}">${E(b)}</div>`;}
    if(/^\d+\.\s/.test(t))return `<div class="cbl-li num">${E(t)}</div>`;
    return `<div class="cbl-p">${E(t)}</div>`;
  }).join('');
}
function renderGroups(){
  const provOf=g=>S.providers.find(pp=>pp.name===(g.provider||S.defaultProvider));
  const cards=S.groups.map(g=>{
    // Codex(GPT)跑自己的 agent 框架:只吃 permissionMode→沙箱层级,allow/deny 与 MCP 门控
    // 都是 Claude 专属(codexcode 根本不接收这些字段)。所以 codex 群不渲染那些无效控件。
    const pr=provOf(g), isCodex=!!pr&&pr.runner==='codex';
    // 群属于哪个平台(服务端按配置 / id 形态算好):企微群没有画布、没有解散、基础技能文案不同;徽标只在配了企微 / Slack 时出(只配飞书的机器零变化)
    const isWe=g.platform==='wecom', isSl=g.platform==='slack', showPlat=!!(S.platforms&&(S.platforms.wecom||S.platforms.slack));
    const platTag=showPlat?`<span class="tag tan" title="${isWe?'企业微信群:只收 @ 机器人的消息;没有画布、表情回应与撤回即停':isSl?'Slack 频道:没有画布与表情回应,群内收发文件未接;控制面用 !命令 或 /sint':'飞书群'}">${isWe?'企业微信':isSl?'Slack':'飞书'}</span>`:'';
    // 权限模型两后端统一为二态:受限(unset ⇒ dontAsk / read-only,fail-closed)⇄ 完全访问
    // (bypassPermissions / danger-full-access)。只认本群自身的值(无全局默认)。
    const isBypass=g.permissionMode==='bypassPermissions'
    // 受限段文案按后端精确:Claude=白名单(dontAsk,下方 allow/deny 决定);Codex=只读(read-only 沙箱)。
    const safeLabel=isCodex?'只读':'白名单'
    const safeTip=isCodex?'read-only 沙箱:只读、不改文件':'dontAsk:仅放行下方 allow/deny 白名单 + 内置只读集,其余自动拒(fail-closed)'
    const fullTech=isCodex?'danger-full-access':'bypassPermissions'
    // 执行模式:两后端同一段控(样式统一),受限段 data-mode=""(清覆盖 ⇒ 默认)⇄ 完全访问 bypass。
    const modeControl=`<div class="segtoggle" data-g="${esc(g.chatId)}">
        <button type="button" class="gseg${isBypass?'':' on'}" data-g="${esc(g.chatId)}" data-mode="" title="${safeTip}">${safeLabel}</button>
        <button type="button" class="gseg danger${isBypass?' on':''}" data-g="${esc(g.chatId)}" data-mode="bypassPermissions" title="${fullTech}:跳过所有权限校验与目录围栏,可读写整机">完全访问</button></div>`
    // 权限区(两后端同名「权限」):完全访问 → 统一警告;受限下 Claude=预设+allow/deny,Codex=一行说明。
    const warnFull=`<div class="warn-line">${IC.warn} 本群 <b>完全访问</b>(${fullTech}):跳过所有权限校验与目录围栏,可读写整机${isCodex?'':',allow/deny 清单<b>不生效</b>'}。上方改回「${safeLabel}」即恢复。</div>`
    const permInner=isBypass?warnFull:(isCodex
      ?`<div class="hint">Codex 为<b>只读沙箱</b>,无 allow/deny 细粒度(Claude 专属)。MCP 在「模型 · 库」页「插件库」的 <b>Codex</b> 区装,全局对所有 codex 群生效。</div>`
      :`<div class="inline" style="gap:6px;margin-bottom:6px"><span class="hint">白名单预设:</span>
          <button class="btn" data-pp="ro" data-g="${esc(g.chatId)}" title="allow 留空 = 只读安全集(缺省,fail-closed)" style="padding:3px 9px;font-size:10.5px">只读</button>
          <button class="btn" data-pp="dev" data-g="${esc(g.chatId)}" title="文件读写 + 联网查询 + 窄 Bash 白名单(npm/node/python/git 本地),deny 兜底线 — 日常推荐" style="padding:3px 9px;font-size:10.5px">开发</button>
          <button class="btn ghost" data-pp="full" data-g="${esc(g.chatId)}" title="Bash(*) 全开,无目录围栏 — 群里任何成员可在主机执行任意命令,仅限完全可信的私人群" style="padding:3px 9px;font-size:10.5px;color:var(--risk)">全信任</button></div>
        <textarea class="gallow" data-g="${esc(g.chatId)}" rows="2" placeholder="allowedTools(逗号/换行分隔)· 留空 = 只读" style="width:100%;font-size:11px;box-sizing:border-box">${esc((g.allowedTools||[]).join(', '))}</textarea>
        <textarea class="gdeny" data-g="${esc(g.chatId)}" rows="1" placeholder="disallowedTools(可留空)" style="width:100%;font-size:11px;box-sizing:border-box;margin-top:5px">${esc((g.disallowedTools||[]).join(', '))}</textarea>
        <div class="inline" style="justify-content:space-between;margin-top:5px"><span class="hint">仅本项目目录 · 空 allow = 只读 · 预设可手改,点保存生效</span><button class="btn primary" data-pol="${esc(g.chatId)}">保存权限</button></div>`)
    // 权限行 + 插件行两后端同名。Claude=按群勾选(strict 接管);codex=只读查看(全局加载,无按群门控)。
    // 基础技能(群项目基础能力):恒有的内建飞书发送能力 + 自知清单说明。只读展示(无门控)。
    // codex 只读沙箱无法联网发送,给出可操作警示;claude 与 codex 完全访问下均可用。
    const baseSkillNote=(isCodex&&!isBypass)?' · <span style="color:var(--risk)">codex 只读沙箱下无法联网发送,需完全访问</span>':''
    // 关联了仓库但当前权限推不动 —— 「开发」预设显式 deny 了 Bash(git push *)、allow 里也没有 pull/push,
    // 配完在群里发现推不了却看不出原因,是这条链路最容易踩的坑。直接标在仓库行旁边。
    const denyPush=(g.disallowedTools||[]).some(t=>/^Bash\(\s*git push/i.test(t))
    const allowPush=(g.allowedTools||[]).some(t=>/^Bash\(\s*(git push|git \*|\*)/i.test(t))
    const pushBlocked=!!g.repo&&!isBypass&&(isCodex||denyPush||!allowPush)
    // 右上角标签(与 workdir 标签并列):没配仓库就不显示 —— 大多数群项目不接远端,常显「未关联」是噪音。
    // repoState 来自服务端读 .git/config 的真实 origin,所以 ✓ 不是「配置里写了个字符串」而是「真关联着」。
    const repoTag=!g.repo?'':(g.repoState==='ok'
      ?`<span class="tag" title="项目目录的 origin 与配置一致:${esc(g.repo)}">仓库 ${IC.check}</span>`
      :`<span class="tag bad" title="${g.repoState==='missing'?'配置里关联着 '+esc(g.repo)+',但项目目录已不是 git 仓库 —— 点「保存」可重新关联':'项目目录的 origin 与配置不一致(可能被手动改过)—— 点「保存」以配置为准重设'}">${g.repoState==='missing'?'仓库 缺失':'仓库 不一致'}</span>`)
    const repoWarn=!pushBlocked?'':(isCodex
      ?' · <span style="color:var(--risk)">'+IC.warn+' codex 只读沙箱无法联网推送,需上方改「完全访问」</span>'

        :' · <span style="color:var(--risk)">'+IC.warn+' 当前 allow 里<b>没有 git push</b>,agent 推不动 —— 去下方「权限」区加 <code>Bash(git push *)</code></span>')
    const permPlug=`<div class="kv" style="align-items:flex-start"><span class="kk">权限</span>
          <div style="flex:1;min-width:0">${permInner}</div></div>
        <div class="kv" style="align-items:flex-start"><span class="kk">基础技能</span>

            <div class="inline" style="gap:6px;flex-wrap:wrap">${isWe?'<span class="chip cap" title="发送(文件/图片/消息) · 拉近 7 天群历史 —— 均针对本群;企业微信没有编辑/撤回/表情回应">企业微信 · 收发群消息</span>':'<span class="chip cap" title="发送(文件/图片/消息) · 拉历史 · 回复/编辑/撤回 · 下载文件 · 表情回应 —— 均针对本群">飞书 · 收发/管理群消息</span>'}<span class="chip cap" title="群里直接对它说「每天9点拉构建报告」就会创建;支持创建/修改/删除定时任务,到点触发执行或只发提醒 —— 下方「定时任务」区可查看/管理">定时任务</span><span class="chip cap" title="内置多套设计风格预设,也能从参考网址/参考图提炼;挑方向时会把候选画成预览图发群里让你指着选(图由风格档 tokens 派生);写进项目 DESIGN.md 后该项目生图/图表全程遵循;全部风格见「模型 · 库」页的「设计风格库」">设计风格档</span></div>

          </div></div>

                <span class="cexp">▼</span>

                  <span>id ${esc(c.id)}</span>
                  <span>${(c.text||'').length} 字</span>${/* 正文框限高滚动,不给字数就看不出下面还有多少 */''}

                </div>
                <div class="cfull">${cronFullHtml(c.text)}</div>
              </div>`).join('')}</div>`:''}
            <div class="cronform" data-g="${esc(g.chatId)}" style="display:none">

              </div>

                <input class="crontext" placeholder="到点做的事 / 要发的消息 / 要跑的命令" style="flex:1;min-width:0"/>

            </div>

              <button class="btn" data-repotest="${esc(g.chatId)}" title="ls-remote 探测:地址通不通、这台机器的凭据有没有权限(不改动任何东西)" style="padding:3px 9px;font-size:10.5px">测试</button>
              <button class="btn primary" data-reposave="${esc(g.chatId)}" title="保存并关联:项目目录若还不是 git 仓库则 git init,然后设 origin(幂等);不 clone、不自动提交" style="padding:3px 9px;font-size:10.5px">保存</button>
            </div>
            <div class="hint" style="margin-top:5px;line-height:1.6">保存即关联(git init + 设 origin)· 推送交给 agent · 留空解除${repoWarn}</div>
          </div></div>
        <div class="kv" style="align-items:flex-start"><span class="kk">设计风格</span>

            ?(g.styles||[]).map(st=>`<div class="inline" style="gap:10px;align-items:flex-start;margin-top:${(g.styles||[]).indexOf(st)?'12px':'0'}">
                ${swatchSvg(st.layout,58)}
                <div style="min-width:0;flex:1">
                  <div class="inline" style="gap:6px;align-items:baseline;flex-wrap:wrap">
                    <b style="font-size:11.5px">${esc(st.name||'(未命名)')}</b>

                    <span class="faint mono" style="font-size:10px">${esc(st.rel||'')}</span></div>
                  <div class="hint" style="margin-top:3px;line-height:1.55">${esc(st.description||'—')}</div>
                  <button class="btn" data-stylecollect="${esc(g.chatId)}" data-stylerel="${esc(st.rel||'')}" title="把这一份复制进全局风格库,之后别的群也能直接挑到它(项目里那份不动)" style="padding:2px 9px;font-size:10.5px;margin-top:8px">收录进风格库</button>
                </div></div>`).join('')
            :'<span class="dim">未设置 · 设计任务开始时 agent 会先从风格库挑候选发群里让你选</span>'}
            ${(g.styles||[]).length>1?'<div class="hint faint" style="margin-top:10px;line-height:1.6">这个项目有多份风格档 —— 出图时按任务挑对应那份(小程序与后台网站的圆角、间距、字号本来就该不一样)</div>':''}
          </div></div>
        <div class="kv" style="align-items:flex-start"><span class="kk">图标</span>
          <div style="flex:1;min-width:0">
            <div class="inline" style="gap:6px;flex-wrap:wrap;align-items:baseline">
              <select data-iconsys="${esc(g.chatId)}" style="width:auto;min-width:150px;padding:2px 8px;font-size:11.5px">
                <option value=""${g.icons?'':' selected'}>未选 · 取图标会取不到</option>
                ${((S&&S.iconSystems)||[]).map(o=>`<option value="${esc(o.system)}"${g.icons&&g.icons.system===o.system?' selected':''}>${esc(o.label)} · ${esc(o.library)}${o.installed?'':'(未安装)'}</option>`).join('')}
              </select>
              ${/* 线性/实心。⚠ **只在这套系统真有两种形态时出现** —— lucide / pixelart
                    只有线性,给个选不动的下拉就是摆一个做不到的选项(图标库那页对它们说的是
                    「这套没有实心 —— 要实心得选另一套」,两处口径要一致)。
                  ⚠ 风格档的 icons.style **优先于**图标档 ⇒ 有覆盖时这里禁用并说清以哪份为准,
                    否则界面显示的和实际取到的是两回事 —— 那正是本条反馈的同款毛病。*/''}
              ${(()=>{
                if(!(g.icons&&g.icons.known&&(g.icons.styles||[]).length>1))return '';
                /* ⚠ 风格档声明了形态时**不能把这个控件禁掉** —— 真实项目的风格档恰恰都写了它,
                     禁掉就等于「加了个控件但它不管用」,比没加更糟(真机第一版就栽在这儿)。
                     做法:改这里就去改真正说了算的那几份档;只有它们**各说各话**时才禁用并点名,
                     那时替人统一会毁掉别人正当的设计决定(小程序实心、后台线性本就合理)。 */
                const decl=(g.styles||[]).filter(s=>s.icons&&s.icons.style);
                const forms=[...new Set(decl.map(s=>s.icons.style))];
                const conflict=forms.length>1;
                const cur=(forms.length===1?forms[0]:null)||g.icons.style||'outlined';
                const nm=s=>s==='filled'?'实心':'线性';
                return `<select data-iconstyle="${esc(g.chatId)}"${conflict?' disabled':''} title="${esc(conflict?'这个项目的几份风格档形态各不相同 —— 要改去各自那份档里改,这里不替你统一':decl.length?('改这里会同时改这 '+decl.length+' 份风格档里的图标形态'):'线性还是实心 · 写进项目的图标设定')}" style="width:auto;padding:2px 8px;font-size:11.5px">`
                  +(g.icons.styles||[]).map(s=>`<option value="${esc(s)}"${cur===s?' selected':''}>${nm(s)}</option>`).join('')
                  +'</select>'
                  +(conflict?`<span class="chip warn" title="${esc(decl.map(s=>(s.name||s.rel)+' → '+nm(s.icons.style)).join(' · '))}">各档形态不同</span>`
                    :decl.length?`<span class="chip tan" title="${esc('图标形态由这几份风格档说了算:'+decl.map(s=>s.name||s.rel).join(' · ')+';改上面的下拉会同时改它们')}">跟 ${decl.length} 份风格档联动</span>`:'');
              })()}
              ${g.icons&&g.icons.styleUnknown?`<span class="chip warn" title="${esc('图标档里写的形态「'+g.icons.styleUnknown+'」认不出来 —— 现在等于没写(按线性走),不是你以为的那个')}">认不出这个形态</span>`:''}
              ${g.icons&&g.icons.known===false?'<span class="chip warn" title="档里写的系统名认不出来(手改坏了?)—— 现在等于没选">认不出这个系统名</span>':''}
              ${g.icons&&g.icons.fallbackUnknown?`<span class="chip warn" title="${esc('档里写的兜底库「'+g.icons.fallbackUnknown+'」认不出来 —— 现在等于没有兜底,而不是去那家找')}">兜底库名认不出</span>`:''}
              ${g.icons&&g.icons.known&&!g.icons.installed?'<span class="chip warn" title="这套系统的图标包没装在这台机器上 —— 取图标会取不到,装一次即可">库未安装</span>':''}
              ${g.icons?`<span class="faint mono" style="font-size:10px">${esc(g.icons.rel)}</span>`:''}
            </div>
            ${/* 样张缩略图 —— 与上面「设计风格」行同构:那行左边一张微缩界面图,这行左边一排真图标。
                 ⚠ **只画线性一排、不画图标名**:群卡回答的是「这个项目现在长什么样」,不是「这套系统全貌」;
                    逐排对照与叫法差异是图标库那张卡的事(挑系统的场景在那一页)。群卡窄,名字会挤成两行。
                 ⚠ 数据来自已缓存的图标库(样张是系统的属性,不进心跳)—— 见 ensureIconLib / paintGroupIconStrips。*/''}
            ${g.icons&&g.icons.known&&g.icons.installed
              ? (()=>{const _d=(g.styles||[]).filter(s=>s.icons&&s.icons.style),_f=[...new Set(_d.map(s=>s.icons.style))];
                      const ov=_f.length===1?{icons:{style:_f[0]}}:_d[0]||null;
                      /* ⚠ 样张要画**实际生效的那种形态**,不是写死「线性」:选了 Tabler 实心却
                         照样看到一排线性图,这行就成了假话 —— 而群卡存在的理由正是「这个项目
                         现在长什么样」。生效值口径必须与 iconSpec 一致:风格档 > 图标档 > 默认。*/
                      const eff=(ov&&ov.icons.style)||g.icons.style||'outlined';
                return `<div class="inline" style="gap:9px;align-items:center;margin-top:8px;min-width:0">
                   <span class="hint" style="flex:none;font-size:9.5px;opacity:.5">${eff==='filled'?'实心':'线性'}</span>
                   ${/* ⚠ `flex:1 1 0` 不是排版偏好,是**防反馈环**:这一排是 flex 行里的一项,
                        不写它就按内容定宽 —— 一旦藏掉几个图标,这排跟着变窄、下次算出来更少,
                        再也长不回去(实测窗口放回原宽后卡在 2 个)。宽度必须由**可用空间**决定。*/''}
                   <span class="iconstrip inline" data-sysstrip="${esc(g.icons.system)}" data-sysstyle="${esc(eff)}" data-cell="18" data-gap="11" style="flex:1 1 0;gap:11px;flex-wrap:nowrap;overflow:hidden;color:var(--ink);min-width:0"></span>
                 </div>`})()
              : ''}
            <div class="hint" style="margin-top:6px;line-height:1.55">${g.icons&&g.icons.known
              ? `图形从 ${esc(g.icons.library)} 来${g.icons.fallbackLibrary?` · 取不到时去 ${esc(g.icons.fallbackLibrary)} 兜底`:' · 不兜底'} · 语义名 ${g.icons.semantics} 条${g.icons.assets?` · 图标目录 ${esc(g.icons.assets)}`:''}`
              : '与设计风格<b>平级</b>的另一件事 —— 这里管图形从哪来、叫什么名、线性还是实心;风格管怎么画(描边粗细/端点/尺寸档)'}</div>
          </div></div>
        ${isWe?'':`<div class="kv" style="align-items:flex-start"><span class="kk">画布</span>
          <div style="flex:1;min-width:0">${g.board&&g.board.url
            ?`<span class="tag">${IC.check} 已创建</span> <a href="${esc(g.board.url)}" target="_blank" rel="noopener" style="color:var(--ember-soft)">打开画板 ${IC.ext}</a>`
            :`<span class="dim">未创建 · 群里让 agent 需要放图时会自动建</span>`}</div></div>`}`
    return `<div class="card${g.paused?' gpaused':''}" data-gid="${esc(g.chatId)}">
    <div class="ph" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="pn mono" style="font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis"><span class="drag" draggable="true" title="拖动排序">${IC.grip}</span>${esc(g.name||g.chatId)}</div>
      <div class="inline" style="gap:6px;flex-shrink:0">
        ${g.paused?'<span class="tag pz" title="暂停中:消息静默丢弃 · 定时任务与画布播报停发 · 配置全保留">'+IC.pause+' 已暂停</span>':''}
        ${platTag}
        <span class="tag${g.exists?'':' bad'}">${g.exists?'workdir '+IC.check:'workdir 缺失'}</span>
        ${repoTag}
        <button class="btn ghost" data-gpause="${esc(g.chatId)}" data-p="${g.paused?'1':'0'}" title="${g.paused?'恢复本群:bot 重新响应消息、定时任务与画布播报恢复':'暂停本群:期间消息静默丢弃、排队清空、定时任务与画布播报停发;进行中的任务跑完;完全可逆,配置全保留'}" style="padding:2px 8px;font-size:11px">${g.paused?IC.play+' 恢复':IC.pause+' 暂停'}</button>
      </div>
    </div>
    <div class="kv"><span class="kk">chatId</span><span class="vv">${esc(g.chatId)}</span></div>
    <div class="kv"><span class="kk">workdir</span><span class="vv" title="${esc(g.workdir)}">${esc(g.workdir)}</span></div>
    <div class="kv"><span class="kk">预览</span><span class="vv inline" style="gap:8px">
      <label class="inline" style="gap:5px;cursor:pointer" title="常驻 = 该群的原型预览不再按闲置(默认 30 分钟)或时长(默认 8 小时)自动停止,直到有人手动停。&#10;这是「让群成员随时都能打开」的正规入口 —— 由你决定,agent 不能自己开。&#10;代价:那个目录会一直挂在局域网上,请用完及时停。">
        <input type="checkbox" class="gpv" data-g="${esc(g.chatId)}"${g.preview&&(g.preview.idleMin===0&&g.preview.maxHours===0)?' checked':''} style="width:auto;margin:0"/>
        <span style="font-size:11.5px;color:var(--dim)">常驻(不自动停)</span>
      </label>
      <span class="faint" style="font-size:11px">当前:${previewPolicyText(g)}</span>
    </span></div>
    <div class="kv"><span class="kk">数据输出</span><span class="vv inline" style="gap:8px">
      <label class="inline" style="gap:5px;cursor:pointer" title="明文 = 该群回复里的手机号/邮箱原样显示,不再遮盖。&#10;适用于成员数据本来就是查询内容的内部业务群 —— 由你决定,助手不能自己开。&#10;密钥类信息(token / key / 私钥)没有开关,任何群都会自动遮盖。">
        <input type="checkbox" class="gpii" data-g="${esc(g.chatId)}"${g.redactPii===false?' checked':''} style="width:auto;margin:0"/>
        <span style="font-size:11.5px;color:var(--dim)">明文(手机号/邮箱不遮盖)</span>
      </label>
      <span class="faint" style="font-size:11px">${g.redactPii===false?'当前:明文':'当前:遮盖'}</span>
    </span></div>
    <div class="kv"><span class="kk">模型</span>
      <select class="gprov" data-g="${esc(g.chatId)}" style="width:auto;min-width:110px;padding:5px 30px 5px 10px;font-size:11.5px">
        ${S.providers.filter(pp=>!pp.hidden&&pp.configured).map(pp=>`<option value="${esc(pp.name)}" ${pp.name===(g.provider||S.defaultProvider)?'selected':''}>${esc(pp.name)}${pp.model?' · '+esc(pp.model):''}</option>`).join('')}
      </select></div>
    <div class="kv"><span class="kk">执行模式</span>${modeControl}</div>
    ${permPlug}
    <div class="spacer"></div>
    <!-- 卡片级破坏性操作,与上面的配置项不是一个层级:留白拉开 + 分隔线切开,别让它和仓库行的按钮糊在一起 -->
    <div class="acts" style="display:flex;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);justify-content:flex-end">
      <button class="btn ghost" data-rm="${esc(g.chatId)}" title="${isWe?'仅解除本控制台里的绑定配置,群本身保留(企业微信群要解散只能在企业微信里操作)':'仅解除本控制台里的绑定配置,飞书群本身保留(解散群在「配置群项目」面板)'}">解除绑定</button>
    </div>
  </div>`;
  }).join('')||'<div class="empty">还没有创建任何群项目</div>';
  $('#groups').innerHTML=`<div style="margin-bottom:14px">
      <button class="btn primary" id="bindBtn" style="padding:10px 18px;font-size:12.5px">${IC.settings}配置群项目</button></div>
    <div class="hint" style="margin:0 2px 16px">本页只配置(模型 / 权限 / 插件);运行控制「停止 · 新会话」在 <b>「概览」</b> · 拖 ${IC.grip} 排序 · 切模型会重置该群会话。</div>
    <div class="grid cols2 stagger" id="ggrid">${cards}</div>`;
  $('#bindBtn').onclick=openBind;
  makeSortable($('#ggrid'),{item:'.card[data-gid]',key:c=>c.dataset.gid,
    save:o=>api('/api/groups/order','POST',{order:o}).then(r=>{S=r;renderOverview();return r;})});  // 概览群行同步新顺序
  $$('#groups [data-rm]').forEach(b=>b.onclick=async()=>{const gg=S.groups.find(x=>x.chatId===b.dataset.rm);if(!confirm('解除本群与项目的绑定?\n(仅移除绑定配置,群本身保留'+(gg&&gg.platform==='wecom'?')':';要解散群请去「配置群项目」面板)')))return;try{S=await api('/api/groups?chatId='+encodeURIComponent(b.dataset.rm),'DELETE');toast('已解除绑定','ok');renderAll();}catch(e){toast(e.message,'err');}});
  // 暂停/恢复:完全可逆(配置全保留)故无冷静期无令牌;暂停方向仍 confirm 一下(会清空排队消息)。
  // 预览常驻开关(operator 的正规入口;群内会收到一行告知)
  $$('#groups .gpv').forEach(c=>c.onchange=async()=>{
    const on=c.checked;
    if(on&&!confirm('设为常驻?该群的原型预览将不再自动停止,那个目录会一直挂在局域网上,直到有人手动停。'))
      {c.checked=false;return;}
    try{S=await api('/api/groups/preview','POST',{chatId:c.dataset.g,persist:on});renderGroups();toast(on?'已设为常驻 · 群内已通知':'已回到默认回收策略 · 群内已通知','ok');}
    catch(e){c.checked=!on;toast(e.message,'err');}});
  // 数据明文开关(v0.11.6):PII 出站按群放行;密钥类无开关。群内会收到一行告知。
  $$('#groups .gpii').forEach(c=>c.onchange=async()=>{
    const on=c.checked;
    if(on&&!confirm('设为明文?该群回复里的手机号/邮箱将原样显示给所有群成员。\n密钥类信息仍会自动遮盖。'))
      {c.checked=false;return;}
    try{S=await api('/api/groups/redact','POST',{chatId:c.dataset.g,showPii:on});renderGroups();toast(on?'已设为明文 · 群内已通知':'已恢复遮盖 · 群内已通知','ok');}
    catch(e){c.checked=!on;toast(e.message,'err');}});
  $$('#groups [data-gpause]').forEach(b=>b.onclick=async()=>{
    const on=b.dataset.p!=='1';
    if(on&&!confirm('暂停本群?\n期间消息不处理(静默丢弃)、排队清空、定时任务与画布播报停发;进行中的任务会跑完。\n完全可逆:配置/会话/画布全保留,点「恢复」即原样回来。'))return;
    try{S=await api('/api/groups/pause','POST',{chatId:b.dataset.gpause,paused:on});renderGroups();renderOverview();toast(on?'已暂停 · 群内已通知':'已恢复 · 群内已通知','ok');}catch(e){toast(e.message,'err');}});
  $$('#groups .gprov').forEach(sel=>sel.onchange=async()=>{try{const r=await api('/api/groups/provider','POST',{chatId:sel.dataset.g,provider:sel.value});S=r;renderOverview();renderGroups();toast(r.switched&&r.switched.live?('已切到 '+sel.value+' · 会话已重置,下条消息生效'):('已保存 '+sel.value+' · daemon 未运行下次生效'),'ok');}catch(e){toast(e.message,'err');}});
  $$('#groups [data-pol]').forEach(b=>b.onclick=async()=>{const g=b.dataset.pol,allow=splitList($('.gallow[data-g="'+g+'"]').value),deny=splitList($('.gdeny[data-g="'+g+'"]').value);try{S=await api('/api/groups/policy','POST',{chatId:g,allowedTools:allow,disallowedTools:deny});toast('权限已保存 · 下轮生效','ok');}catch(e){toast(e.message,'err');}});
  // 仓库地址:保存 = 校验 + git init(若非仓库)+ 设 origin(幂等,不 clone/不提交);留空保存 = 解除关联。
  // 测试 = ls-remote 探「地址通不通 + 这台机器的凭据有没有权限」,不落地任何东西。两者都可能走网络 → 置忙防连点。
  $$('#groups [data-reposave]').forEach(b=>b.onclick=async()=>{const g=b.dataset.reposave,v=$('.grepo[data-g="'+g+'"]').value.trim();

  $$('#groups [data-stylecollect]').forEach(b=>b.onclick=()=>{const id=b.dataset.stylecollect,rel=b.dataset.stylerel||'';

  /* 图标系统:选一套 ⇒ 落进**那个项目**的 design/icons.md(不写群配置 —— 取图标的命令是在
     项目目录里跑的,够不着群配置;项目 clone 到别处时写在群配置里的选择也会丢)。
     ⚠ 换系统会换掉整套命名词汇,而**页面上已经取过的图标不会自动跟着变** ⇒ 服务端回 409 让
     这里显式确认一次(教训 10:做了 A 别让人以为做了 B)。confirm 的文案由服务端给,
     因为「换成哪套之后『更多』会从什么变成什么」只有那边算得准。 */
  paintGroupIconStrips(); // 群卡「图标」行那排缩略图:异步填,先留空位
  $$('#groups [data-iconsys]').forEach(sel=>{sel.dataset.prev=sel.value;sel.onchange=async()=>{

        r=await api('/api/design/icons','POST',{chatId:id,system:want,force:true});

      sel.dataset.prev=want;
      /* ⚠ 换到一套供不起当前形态的系统时,服务端会把形态丢掉 —— **必须说出来**:

      toast('图标系统已定:'+want+(r&&r.styleDropped?' · ⚠ 这套没有实心,形态已回到线性':' · 已写进项目的 design/icons.md'),'ok');

    }catch(e){sel.value=prev;toast(e.message,'err');}

  };});
  /* 线性/实心:与系统落同一份档。⚠ **不传 force** —— 系统没变时服务端本就不会
     要确认;真收到 409 说明界面上的系统与档里的不一致(别的地方改过),那时该如实报出来让人
     重开页面,而不是拿 force 蒙头盖过去。⚠ system 必须一起传:服务端按「没传的键保持原值」

  $$('#groups [data-iconstyle]').forEach(sel=>{sel.dataset.prev=sel.value;sel.onchange=async()=>{
