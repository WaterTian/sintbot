  $$('#groups [data-repotest]').forEach(b=>b.onclick=async()=>{const g=b.dataset.repotest,v=$('.grepo[data-g="'+g+'"]').value.trim();
    if(!v){toast('先填仓库地址','err');return;}
    b.disabled=true;const old=b.textContent;b.textContent='…';
    try{const r=await api('/api/groups/repo/test','POST',{repo:v});
      toast(r.empty?'✓ 可访问 · 远端是空仓库(等首次推送)':('✓ 可访问 · '+r.branches+' 个分支'),'ok');}
    catch(e){toast(e.message,'err');}
    finally{b.disabled=false;b.textContent=old;}});
  // 定时任务:新建(展开内联表单)/添加/开关/删除。写 groups[chatId].crons → daemon 热重载后 scheduler 生效;仅作用本群。
  $$('#groups [data-cronnew]').forEach(b=>b.onclick=()=>{const f=b.closest('.kv').querySelector('.cronform');if(!f)return;const show=f.style.display==='none';f.style.display=show?'block':'none';if(show)f.querySelector('.cronexpr').focus();});
  // 一次性简写(与后端 expandAt 对齐):只填 10:20 / 07-16 10:20 / 完整日期 / 中文月日 → 走 at;否则当循环 cron。
  const CRON_ONEOFF=[/^\d{1,2}:\d{2}$/,/^\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}$/,/^\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}$/,/^\d{1,2}月\d{1,2}日\s*\d{1,2}:\d{2}$/,/^\d{4}年\d{1,2}月\d{1,2}日\s*\d{1,2}:\d{2}$/];
  $$('#groups [data-cronadd]').forEach(b=>b.onclick=async()=>{const f=b.closest('.cronform');const val=f.querySelector('.cronexpr').value.trim(),kind=f.querySelector('.cronkind').value,text=f.querySelector('.crontext').value.trim();if(!val){toast('填写时间(如「10:20」「07-16 10:20」「每天 09:00」)','err');return;}if(!text){toast(kind==='do'?'填写到点让 agent 做的事':kind==='run'?'填写要跑的命令':'填写要发送的消息','err');return;}const isDate=CRON_ONEOFF.some(re=>re.test(val));const body=isDate?{chatId:b.dataset.cronadd,at:val,kind,text}:{chatId:b.dataset.cronadd,expr:val,kind,text};try{S=await api('/api/groups/cron/add','POST',body);renderGroups();toast(isDate?'已创建一次性任务':'已创建定时任务','ok');}catch(e){toast(e.message,'err');}});
  $$('#groups [data-crontgl]').forEach(b=>b.onclick=async()=>{try{S=await api('/api/groups/cron/toggle','POST',{chatId:b.dataset.g,id:b.dataset.crontgl,enabled:b.dataset.en==='1'});renderGroups();}catch(e){toast(e.message,'err');}});
  $$('#groups [data-cronrm]').forEach(b=>b.onclick=async()=>{if(!confirm('删除该定时任务?'))return;try{S=await api('/api/groups/cron/remove','POST',{chatId:b.dataset.g,id:b.dataset.cronrm});cronOpen.delete(b.dataset.cronrm);renderGroups();toast('已删除','ok');}catch(e){toast(e.message,'err');}});
  // 点整行展开/收起全文。行内那三个按钮各管各的(启停/删除/复制),别被行的 handler 抢走。
  $$('#groups [data-cronx]').forEach(r=>r.onclick=(e)=>{
    if(e.target.closest('.cdot,.crm,.ccopy'))return;
    const b=r.nextElementSibling; if(!b||!b.classList.contains('cronbody'))return;
    const open=b.style.display==='none';
    b.style.display=open?'block':'none'; r.classList.toggle('open',open);
    if(open)cronOpen.add(r.dataset.cronx); else cronOpen.delete(r.dataset.cronx);
  });
  // 复制全文。⚠ 控制台常经局域网 http 访问 = 非 secure context,navigator.clipboard 在那儿是
  // undefined ⇒ 必须留 execCommand 兜底(与 toast 那颗复制按钮同一套写法)。
  $$('#groups .ccopy').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const txt=b.dataset.full||''; if(!txt)return;
    const done=()=>{b.textContent='已复制';setTimeout(()=>b.textContent='复制全文',1200);};
    // 兜底走临时 textarea 而不是选中正文区:正文是按行拆开渲染的,选 DOM 复制出来会走样
    const pick=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('style','position:fixed;top:0;left:0;opacity:0');document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();done();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(pick);
    else pick();
  });
  // 执行模式段控(两后端统一,替代原 codex-only toggle + Claude select):受限 ⇄ 完全访问,
  // 映射 dontAsk('' 清覆盖)/ bypassPermissions。点当前态不动作;完全访问需二次确认(文案后端无关)。
  $$('#groups .gseg').forEach(b=>b.onclick=async()=>{
    const g=b.dataset.g,mode=b.dataset.mode,wantBypass=mode==='bypassPermissions';
    const curBypass=(S.groups.find(x=>x.chatId===g)||{}).permissionMode==='bypassPermissions';
    if(wantBypass===curBypass)return; // 已是该状态,不重复保存
    if(wantBypass&&!confirm('⚠ 完全访问:跳过所有权限校验与目录围栏 — 群里任何成员的一条消息都能在这台机器上执行任意操作。\n仅限完全可信的私人群。'))return;
    try{S=await api('/api/groups/policy','POST',{chatId:g,permissionMode:mode});renderGroups();toast(wantBypass?'已设为完全访问 · 下轮生效':'已设为受限 · 下轮生效','ok');}
    catch(e){toast(e.message,'err');}});
  $$('#groups [data-pp]').forEach(b=>b.onclick=()=>{
    const p=PERM_PRESETS[b.dataset.pp];if(!p)return;
    if(b.dataset.pp==='full'&&!confirm('⚠ 全信任 = Bash(*) 全开,无目录围栏!\n群里任何成员的一条消息都能在这台机器上执行任意命令(删文件/外发数据/装软件)。\n仅限完全可信的私人群。确定填入?(仍需点「保存权限」才生效)'))return;
    $('.gallow[data-g="'+b.dataset.g+'"]').value=p.allow.join(', ');
    $('.gdeny[data-g="'+b.dataset.g+'"]').value=p.deny.join(', ');
    toast('已填入「'+p.label+'」预设 — 可手改,点「保存权限」生效','ok');});
  // 插件区:Claude 点「配置」懒加载 → 勾选即存(strict 接管),按钮变「保存」= 收起;
  // codex 点「查看」= 只读展开全局 codex MCP(无勾选),按钮变「收起」。
  $$('#groups [data-plug]').forEach(b=>b.onclick=async()=>{
    const cid=b.dataset.plug,box=$('.plugbox[data-g="'+cid+'"]');
    const grp=S.groups.find(x=>x.chatId===cid)||{},pv=S.providers.find(p=>p.name===(grp.provider||S.defaultProvider)),isCodex=!!pv&&pv.runner==='codex';
    const openLbl=isCodex?'收起':'保存',closeLbl=isCodex?'查看':'配置';
    if(box.style.display!=='none'){box.style.display='none';b.textContent=closeLbl;return;}  // 收起
    box.style.display='block';b.textContent=openLbl;box.innerHTML='<span class="spin"></span>';
    try{const r=await api('/api/plugins?chatId='+encodeURIComponent(cid));renderPlugBox(cid,box,r,isCodex);}
    catch(e){box.innerHTML='<div class="reply err">'+IC.x+' '+esc(e.message)+'</div>';}
  });
}

// 群卡插件面板 — 勾选 = 本群加载该 MCP,即存即生效(下轮)。默认(未配置)= 全部加载 ⇒ 全勾;
// 取消勾即进入 strict 接管(只载勾选的用户级 + 项目级全部)。checkbox 即真相,故无需「恢复默认」
// 按钮(要全恢复 = 全勾)。项目级 MCP 恒载入(只读、禁勾)。启用即自动放行 mcp__名__*(deny 仍优先)。
// 命令(detail)只进 title 悬浮,行内不显 —— 群卡按名勾选即可,完整命令看模型页「插件库」。
// 用户级 skills 仍不列(2026-07-03 拍板:列表累赘);**项目级技能改为只读显示**(2026-08-03 拍板
// v0.11.2 —— 当年拍板针对的是用户级列表噪音,项目自带 cloudbase 这类重量级技能不显示 = 能力隐身)。
// 摘要行带项目级计数(g.proj,服务端读 workdir 声明):不点开「配置」也看得见项目自带什么。
function plugSummary(g){
  const p=g&&g.plugins, pr=(g&&g.proj)||{mcp:[],skills:[]};
  const proj=[pr.mcp.length?`项目 ${pr.mcp.length}`:'',pr.skills.length?`技能 ${pr.skills.length}`:''].filter(Boolean).join(' · ');
  const lib=!p?'默认加载':`已启用 · MCP ${(p.mcp||[]).length}`+((p.skills||[]).length?` · Skill ${(p.skills||[]).length}`:'');
  return proj?`${proj} · ${lib}`:lib;
}
// MCP 可达性徽标 —— 插件库与群卡两处共用。
// ⚠ **只标例外**:逐个标「可达」是噪音(本项目「常态不用说,例外才值得标」那条),
//   而这次要治的恰恰是「连不上的那个长得和好的一模一样」。
//   down = 确定不可用(勾了它的群那一轮直接跳过不加载);unknown = 本机直连没探通,
//   但仍照常加载(直连不走代理,探不通 ≠ 不可用),所以用最弱的样式,别喊。
function reachChip(r){
  if(!r||r.status==='ok')return '';
  const bad=r.status==='down';
  const tip=(r.detail||'')+(bad?' · 勾选了它的群这一轮会跳过它,不加载也不重试;服务起来后自动恢复'
    :' · 仍会照常加载 —— 本机直连探测不走代理,探不通不代表它不可用');
  return `<span class="chip ${bad?'warn':'none'}" title="${esc(tip)}" style="font-size:9px;padding:0 5px;flex-shrink:0;margin-left:6px">${bad?'连不上':'未确认'}</span>`;
}
function renderPlugBox(cid,box,r,isCodex){
  const mrow=(name,detail,reach)=>`<div class="kv" style="padding:3px 0;border-top:none"><span class="kk mono" style="white-space:nowrap">${esc(name)}</span><span class="vv" title="${esc(detail||'')}">${esc(detail||'MCP')}</span>${reachChip(reach)}</div>`;
  if(isCodex){ // codex:只读 —— 全局加载 ~/.codex/config.toml 全部,无按群门控
    const cm=(r.codex&&r.codex.mcp)||[];
    box.innerHTML=(cm.length?cm.map(m=>mrow(m.name,m.detail,m.reach)).join(''):'<div class="hint" style="padding:2px 0">无 —— 去「模型 · 库」页「插件库」的 Codex 区添加</div>')
      +`<div class="hint" style="margin-top:7px">codex <b>全局加载</b>全部 · 对所有 codex 群一致 · 在「模型 · 库」页「插件库」管理</div>`;
    return;
  }
  const en=r.enabled,enM=new Set((en&&en.mcp)||[]);
  // detail(完整命令)只进 label title 悬浮;行内只显 checkbox + 名 + 来源 chip。
  const row=(type,name,src,detail,checked,fixed,reach)=>`<label class="inline" style="gap:7px;font-size:11px;padding:3px 0;cursor:${fixed?'default':'pointer'}" title="${esc(detail||'')}">
    <input type="checkbox" class="${type}" value="${esc(name)}" ${checked?'checked':''} ${fixed?'disabled':''} style="width:auto"/>
    <span class="mono" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>
    ${reachChip(reach)}<span class="chip ${checked?'set':'none'}" style="font-size:9px;padding:0 5px;flex-shrink:0">${esc(src)}</span></label>`;
  const pm=(r.project&&r.project.mcp)||[],gm=(r.global&&r.global.mcp)||[];
  // 未配置(en null)默认全勾 = 现状全加载;已配置则按 enM。项目级恒勾、禁改。
  const mcpRows=[...pm.map(m=>row('pmcp-fixed',m.name,'项目',m.detail,true,true,null)),
                 ...gm.map(m=>row('pmcp',m.name,m.source||'用户',m.detail,en?enM.has(m.name):true,false,m.reach))].join('')||'<div class="hint" style="padding:2px 0">无 —— 去「模型 · 库」页「插件库」添加</div>';
  // ⚠ 勾着 + 连不上 = 此前最坑的组合:勾选框全绿,而每一轮都在替它付一次启动失败,
  //   三处(体检 / 这里 / 群里)都不吭声。现在这里直说,并说清「不用动勾选」。
  const dead=gm.filter(m=>m.reach&&m.reach.status==='down'&&(en?enM.has(m.name):true));
  // 项目级技能(workdir/.claude/skills,随项目自动加载):只读信息行 —— 不显示 = 能力隐身(v0.11.2)。
  const ps=(r.project&&r.project.skills)||[];
  const skillRow=ps.length?`<div class="hint" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px" title="${esc(ps.map(s=>s.name+(s.description?' — '+s.description.slice(0,80):'')).join('\n'))}">项目技能(随项目自动加载):<span class="mono">${ps.map(s=>esc(s.name)).join('、')}</span></div>`:'';
  // ⚠ 「会跳过」只对**配过插件**的群成立(en 非空):没配过的群是默认加载、claude 自己读全部,跳过机制根本不经过它们 ——
  //   对这类群得反过来说清「不会跳过、每轮都在付」,并给出路(保存一次勾选)。审查逮到的「说的和做的不一致」。
  const deadRow=dead.length?`<div class="hint" style="margin-top:6px;color:var(--warn)" title="${esc(dead.map(m=>m.name+' — '+((m.reach&&m.reach.detail)||'')).join('\n'))}">${en?`勾着但连不上:<span class="mono">${dead.map(m=>esc(m.name)).join('、')}</span> — 这一轮会跳过不加载(否则每轮都白等它启动失败)。<b>不用取消勾选</b>,服务起来后自动恢复。`:`连不上:<span class="mono">${dead.map(m=>esc(m.name)).join('、')}</span> — 本群没配过插件、按默认加载全部,<b>不会跳过</b>,每轮都会替它付一次启动失败;要让它被自动跳过,在这里<b>保存一次勾选</b>(勾上要用的那几个即可),之后服务起来后自动恢复。`}</div>`:'';
  box.innerHTML=`${mcpRows}${skillRow}${deadRow}
    <div class="hint" style="margin-top:7px" title="启用即自动放行 mcp__名__*,deny 仍优先;取消全部 = 只留项目级">勾选的 MCP 本群加载 · 下轮生效</div>`;
  const sum=$('.plugsum[data-g="'+cid+'"]');
  const saveNow=async(cb)=>{
    const mcp=[...box.querySelectorAll('.pmcp:checked')].map(i=>i.value);
    const skills=(en&&en.skills)||[];  // 手工配置的 skills 原样保留
    try{S=await api('/api/groups/plugins','POST',{chatId:cid,mcp,skills});
      // plugSummary 收的是群对象(v0.11.2 起要带 proj 项目级计数)—— 从 POST 返回的新 state 取,
      // 别手拼 {mcp,skills}(那会丢 proj,摘要行的「项目 N」当场消失)。
      if(sum){const g2=S.groups.find(x=>x.chatId===cid);sum.textContent=plugSummary(g2||{plugins:{mcp,skills}});}
      toast('已生效(下轮)','ok');}
    catch(e){toast(e.message,'err');if(cb)cb.checked=!cb.checked;}};  // 失败回滚勾选态
  box.querySelectorAll('.pmcp').forEach(i=>i.onchange=()=>saveNow(i));
  // 安装/添加 MCP 已统一到模型页「插件库」命令行:群卡只做门控(勾选),
  // 不再重复放安装框 —— 库安装走 --scope user 与 cwd 无关,群卡那个框冗余。
}

async function openBind(){
  // 多平台并存:配了两个以上才显示切换;只配了一个就直接那一种(Slack 列 bot 已加入的频道)。企微形态 = 指引 + 刷新 + 候选(机器人被 @ 过的群)+ 手填,
  // 没有建群 / 解散(平台上没接口);第二步「项目与模型」两边共用;保存时写入 platform。
  const plats=S.platforms||{feishu:true,wecom:false};
  const PL={feishu:'飞书',wecom:'企业微信',slack:'Slack'};
  const onPlats=Object.keys(PL).filter(k=>plats[k]);
  const both=onPlats.length>1;
  let plat=(plats.feishu||!onPlats.length)?'feishu':onPlats[0];
  let chats=null,err=null,hint='';
  const loadChats=async()=>{chats=null;err=null;hint='';
    try{
      // ⚠ 都只列「bot 在里面的」:Slack 列 bot 已加入的频道(没 /invite 的频道绑了也收不到消息)
      if(plat==='slack'){const r=await api('/api/slack/channels');chats=(r.channels||[]).map(c=>({chatId:c.id,name:c.name+(c.isPrivate?' 🔒':'')}));}
      else{const r=await api(plat==='wecom'?'/api/wecom/chats':'/api/feishu/chats');chats=r.chats;hint=r.hint||'';}
    }catch(e){err=e.message;}};
  await loadChats();
  let picked='',pickedName='';
  const boundIds=new Set(S.groups.map(g=>g.chatId));
  // rows: name + 已绑定 tag。解散按钮只出现在【已绑定】的群上—— 未绑定的群
  // 不归 sbot 管辖;有其他用户时走两步式(群内预告 → 确认解散),空群/仅管理员一步解散。
  const isWe=()=>plat==='wecom';
  // 企微群没有解散按钮(平台上没接口);飞书群已绑定的才出「解散」
  const renderList=()=>(chats&&chats.length?`<div class="chatpick">${chats.map(c=>`<div class="ci" data-cid="${esc(c.chatId)}" data-cname="${esc(c.name)}">
      <span class="cnm"><span class="nm">${esc(c.name)}</span>${boundIds.has(c.chatId)?'<span class="chip set" style="font-size:9.5px;padding:1px 6px">已绑定</span>':''}</span>
      <span class="inline" style="gap:8px"><span class="cid">${esc(c.chatId)}</span>${(plat==='feishu'&&boundIds.has(c.chatId))?`<button class="btn ghost cdel" data-del="${esc(c.chatId)}" data-dname="${esc(c.name)}" title="解散该群并移除绑定(bot 须为群主;有其他成员时先群内预告再确认)" style="padding:2px 7px;font-size:11px">解散</button>`:''}</span>
    </div>`).join('')}</div>`
    :`<div class="empty" style="padding:10px 2px">${err?'拉群列表失败:'+esc(err):(isWe()?'还没有机器人被 @ 过的群':plat==='slack'?'机器人还没被拉进任何频道 — 去频道里发 /invite @机器人':'bot 不在任何群 / 未配飞书')} · 可手动填 ${plat==='slack'?'频道 ID':'chatId'}</div>`);
  const manualHint=()=>isWe()?'只列了机器人被 @ 过的群 —— 手填的 id 若机器人不在群里,绑了也收不到消息;单聊填对方账号':plat==='slack'?'只列了机器人已加入的频道 —— 手填的频道 ID 若机器人不在频道里,绑了也收不到消息':'只列了 bot 在里面的群 —— 手填的 id 若 bot 不在群里,绑了也收不到消息';
  const manualPh=()=>isWe()?'wr…':plat==='slack'?'C…':'oc_...';
  // 第一步的头与指引按平台切:飞书 = 「创建新群」;企微 = 三步指引 + 「刷新列表」(新群 @ 过机器人后才出现在候选里)
  const renderHead=()=>plat==='slack'
    ?`<div class="chatpick-head"><span class="ttl">选择 Slack 频道</span><button class="btn" id="mRefresh" style="padding:5px 10px;font-size:12px">${IC.refresh} 刷新列表</button></div>
      <div class="hint" style="margin:-6px 0 10px;line-height:1.7">在频道里发 <b>/invite @机器人</b> 把它拉进来,刷新后就会出现在这里</div>`
    :isWe()
    ?`<div class="chatpick-head"><span class="ttl">选择企业微信群</span><button class="btn" id="mRefresh" style="padding:5px 10px;font-size:12px">${IC.refresh} 刷新列表</button></div>
      <div class="hint" style="margin:-6px 0 10px;line-height:1.7">在企业微信里<b>建群 → 从群菜单把机器人加进群 → @ 它一次</b>,刷新后就会出现在这里${hint?' · '+esc(hint):''}</div>`
    :`<div class="chatpick-head"><span class="ttl">选择飞书群</span><button class="btn" id="mNewChat" style="padding:5px 10px;font-size:12px">${IC.plus} 创建新群</button></div>`;
  $('#modal').innerHTML=`<h3>配置群项目</h3>
    ${both?`<div class="inline" style="margin:-4px 0 14px;gap:10px"><span class="faint" style="font-size:11.5px">平台</span><div class="segtoggle" id="mPlat">${onPlats.map(k=>`<button type="button" class="${plat===k?'on':''}" data-plat="${k}">${PL[k]}${k==='slack'?' 频道':'群'}</button>`).join('')}</div></div>`:''}
    <div id="chatHeadWrap">${renderHead()}</div>
    <div id="chatListWrap">${renderList()}</div>
    <div id="newChatRow" style="display:none;margin-bottom:16px">
      <div class="newchat-row" style="margin-bottom:8px"><input id="mNewName" placeholder="新群名称"/><button class="btn" id="mNewGo">建群</button></div>
      <div class="inline" id="mAutoInvite" style="flex-wrap:wrap;gap:6px;font-size:11.5px"></div>
    </div>
    <div class="inline" style="justify-content:flex-end;margin:-8px 0 14px"><a class="lnk2" id="mManual" href="#">列表里没有?手动填 ID</a></div>
    <div id="manualRow" class="field" hidden><label class="f">chat id<span class="faint" style="font-weight:400;margin-left:6px" id="mManualHint">${manualHint()}</span></label><div class="inline" style="gap:8px"><input id="mChat" placeholder="${manualPh()}" value="" style="flex:1"/><button class="btn" id="mManualGo">下一步</button></div></div>
    <div id="mStep2" hidden>
    <div class="fx-sub" style="margin-top:2px">项目与模型</div>
    <div id="mPicked" class="picked-row"></div>
    <div class="field"><label class="f">项目目录${(S.projectsRoots&&S.projectsRoots.length)?`<span class="faint" style="font-weight:400;margin-left:6px">须在 ${esc(S.projectsRoots.join(' 或 '))} 下</span>`:''}</label>
      <div class="inline" style="gap:10px"><button class="btn" id="mBrowse" style="white-space:nowrap">选择目录…</button><span id="mWdShow" class="faint" style="flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">未选择</span><a class="lnk2" id="mWdManual" href="#" style="white-space:nowrap">手动填写</a></div>
      <div id="mWdManualRow" hidden style="margin-top:6px"><input id="mWd" placeholder="${esc((S.projectsRoots&&S.projectsRoots[0])||'/path/to/proj')}${(S.projectsRoots&&S.projectsRoots[0]&&/^[A-Za-z]:\\/.test(S.projectsRoots[0]))?'\\':'/'}项目名" style="width:100%"/></div></div>
    <div class="field"><label class="f">模型</label><select id="mProv">${S.providers.filter(p=>!p.hidden&&p.configured).map(p=>`<option ${p.name===S.defaultProvider?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="inline" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave" disabled>创建</button></div>
    </div>`;
  $('#modalBg').classList.add('show');
  // ── 两步流:先选群(或建群 / 手动填 ID),选定了才出现「项目与模型」(用户 2026-09-07 提出)。
  //   原先四样并列(列表 · 手填 id · workdir · 模型),看不出哪个是主动作;点列表也只是把 id 静默
  //   灌进一个文本框。现在:选定 ⇒ 摘要行 + 第二步展开 + 焦点落到 workdir;「换一个」回第一步。
  const step2=$('#mStep2'),pickedRow=$('#mPicked');
  const updateSave=()=>{const b=$('#mSave');if(b)b.disabled=!(picked&&$('#mWd').value.trim());};
  // 目录以「选择目录…」为主入口(选择器天然在项目根目录之内,不会撞围栏);#mWd 仍是唯一的值来源,手填折叠着。
  const setWd=(v)=>{$('#mWd').value=v||'';const sh=$('#mWdShow');if(sh){sh.textContent=v||'未选择';sh.classList.toggle('faint',!v);}updateSave();};
  const select=(cid,name,manual)=>{
    picked=cid;pickedName=name||'';$('#mChat').value=cid;
    $$('#modal .ci').forEach(x=>x.classList.toggle('sel',x.dataset.cid===cid));
    // 已绑定的群:载入现有绑定(workdir/模型),按钮转「保存修改」(upsert 保留权限)
    const g=S.groups.find(x=>x.chatId===cid);
    // 改既有群:平台以群本身为准(切换器只是候选列表的来源,不能把企微群改写成飞书 —— 对抗审查逮到的)
    if(g&&g.platform&&g.platform!==plat){plat=g.platform;$$('#mPlat button').forEach(b=>b.classList.toggle('on',b.dataset.plat===plat));}
    pickedRow.innerHTML=`<span class="chip ${g?'set':'cap'}">${g?'已绑定':(manual?'手动填写':'新绑定')}</span>${both?`<span class="chip tan">${PL[plat]}</span>`:''}<span class="pnm">${esc(name||cid)}</span>${name?`<span class="cid">${esc(cid)}</span>`:'<span class="cid"></span>'}<a class="lnk" id="mRepick" href="#">换一个</a>`;
    $('#mRepick').onclick=(e)=>{e.preventDefault();repick();};
    if(g){setWd(g.workdir||'');if(g.provider)$('#mProv').value=g.provider;$('#mSave').textContent='保存修改';}
    else{setWd('');$('#mSave').textContent='创建';}
    $('#manualRow').hidden=true;step2.hidden=false;updateSave();$('#mBrowse').focus();
  };
  const repick=()=>{picked='';pickedName='';$('#mChat').value='';$$('#modal .ci').forEach(x=>x.classList.remove('sel'));step2.hidden=true;setWd('');$('#mSave').textContent='创建';updateSave();};
  $('#mWd').addEventListener('input',()=>setWd($('#mWd').value));
  $('#mWdManual').onclick=(e)=>{e.preventDefault();const r=$('#mWdManualRow');r.hidden=!r.hidden;if(!r.hidden)$('#mWd').focus();};
  // 根目录在控制台只读(不给「更改」入口):它是围栏的策略,改只走安装向导或机器上的配置文件
  $('#mManual').onclick=(e)=>{e.preventDefault();const r=$('#manualRow');r.hidden=!r.hidden;if(!r.hidden)$('#mChat').focus();};
  const manualGo=()=>{const v=$('#mChat').value.trim();if(!v){toast('先填 ID','err');return;}select(v,'',true);};
  $('#mManualGo').onclick=manualGo;
  $('#mChat').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();manualGo();}});
  // Auto-invite line: a new chat gets bot(owner) + the admin(s) the
  // operator ticks. Admins are configured in 设置; here you only choose which of them
  // to pull into THIS group (all ticked by default). No admin ⇒ bot-only group is
  // invisible in Feishu, so点建群前提示去设置里加。
  const fe=S.feishu||{};
  const admins=Array.isArray(fe.admins)?fe.admins:[];
  const renderAutoInvite=()=>{
    const el=$('#mAutoInvite');if(!el)return;
    const botChip='<span class="chip set">'+IC.bot+' bot(群主)</span>';
    if(!admins.length){
      el.innerHTML=botChip+'<span class="chip none">'+IC.warn+' 未配置管理员</span><span class="faint">纯 bot 群飞书里谁都看不到 — 先去「设置 → 飞书应用」加管理员</span>';
      return;
    }
    el.innerHTML=botChip+`<span class="faint">勾选拉入的管理员:</span><div class="fx-invite">${admins.map(a=>`<label><input type="checkbox" class="mAdminChk" value="${esc(a.openId)}" checked/> ${IC.user} ${esc(a.name||a.openId)}</label>`).join('')}</div>`;
  };
  const bindRows=()=>{
    $$('#modal .ci').forEach(ci=>ci.onclick=(e)=>{if(e.target.closest('.cdel'))return;
      select(ci.dataset.cid,ci.dataset.cname||'');});
    // 解散成功后的统一收尾:同步状态、刷新列表/群项目页/概览
    const disbandDone=(b,r)=>{S=r;
      chats=chats.filter(c=>c.chatId!==b.dataset.del);if(picked===b.dataset.del)repick();
      boundIds.delete(b.dataset.del);
      $('#chatListWrap').innerHTML=renderList();bindRows();renderGroups();renderOverview();
      toast('已解散并移除绑定','ok');};
    // 武装确认按钮:服务端冷静期内锁定倒计时,到点才可点(服务端同样校验 readyAt)
    const armBtn=(b,token,users,cool)=>{
      b.dataset.armed='1';b.dataset.dtoken=token;
      b.style.color='var(--fail)';b.style.borderColor='rgba(var(--fail-rgb),.5)';
      let left=cool;
      const tick=()=>{if(!document.body.contains(b))return;
        if(left>0){b.disabled=true;b.textContent='确认解散('+left+'s)';left--;setTimeout(tick,1000);}
        else{b.disabled=false;b.textContent='确认解散('+users+'人)';}};
      tick();};
    const disbandUrl=(id,token)=>'/api/feishu/chats?chatId='+encodeURIComponent(id)+(token?('&confirm=1&dtoken='+encodeURIComponent(token)):'');
    $$('#modal .cdel').forEach(b=>b.onclick=async(e)=>{e.stopPropagation();
      const armed=b.dataset.armed==='1';
      if(!armed){
        // 危险操作:输入完整群名才发起(GitHub 删库式确认)
        const typed=prompt('⚠ 危险操作:解散群并移除绑定,不可恢复!\n请输入完整群名以确认:\n\n'+b.dataset.dname);
        if(typed===null)return;
        if(typed.trim()!==b.dataset.dname){toast('群名不匹配,已取消','err');return;}
      }
      b.disabled=true;
      try{
        if(armed)return disbandDone(b,await api(disbandUrl(b.dataset.del,b.dataset.dtoken),'DELETE'));
        const r=await api(disbandUrl(b.dataset.del),'DELETE');
        if(r.users>0){
          toast('群里还有 '+r.users+' 名成员('+(r.names||[]).join('、')+') — 已在群内发出预告,'+(r.coolDownSec||0)+'s 冷静期后可确认','err');
          armBtn(b,r.disbandToken,r.users,r.coolDownSec||0);
          return;
        }
        // 空群/仅管理员:无冷静期,直接带 token 走第二段(对用户仍是一次交互)
        disbandDone(b,await api(disbandUrl(b.dataset.del,r.disbandToken),'DELETE'));
      }catch(err2){toast(err2.message,'err');b.disabled=false;}});
  };
  // 第一步头部的按钮(建群 / 刷新)每次重画头都要重新挂;平台切换 = 重拉列表 + 重画头与列表 + 回到第一步
  const bindHead=()=>{
    const nc=$('#mNewChat');if(nc)nc.onclick=()=>{const r=$('#newChatRow');const show=r.style.display==='none';r.style.display=show?'block':'none';if(show){$('#mNewName').focus();renderAutoInvite();}};
    const rf=$('#mRefresh');if(rf)rf.onclick=async()=>{rf.disabled=true;rf.innerHTML='<span class="spin"></span> 刷新中…';await loadChats();$('#chatListWrap').innerHTML=renderList();bindRows();$('#chatHeadWrap').innerHTML=renderHead();bindHead();if(err)toast(err,'err');else toast('已刷新:'+(chats?chats.length:0)+' 个群','ok');};
  };
  const switchPlat=async(np)=>{if(np===plat)return;plat=np;$$('#mPlat button').forEach(b=>b.classList.toggle('on',b.dataset.plat===plat));
    repick();$('#newChatRow').style.display='none';
    $('#chatListWrap').innerHTML='<div class="empty" style="padding:10px 2px"><span class="spin"></span> 加载中…</div>';
    await loadChats();$('#chatHeadWrap').innerHTML=renderHead();bindHead();$('#chatListWrap').innerHTML=renderList();bindRows();
    $('#mManualHint').textContent=manualHint();
    $('#mChat').placeholder=manualPh();};
  $$('#mPlat button').forEach(b=>b.onclick=()=>switchPlat(b.dataset.plat));
  bindRows();bindHead();
  $('#mNewGo').onclick=async()=>{const name=$('#mNewName').value.trim();if(!name){toast('群名称必填','err');return;}
    if(!admins.length){toast('先去「设置 → 飞书应用」加管理员 — 只有 bot 的群飞书里谁都看不到','err');return;}
    const invitees=$$('#mAutoInvite .mAdminChk:checked').map(c=>c.value);
    if(!invitees.length){toast('至少勾选一名管理员拉入,否则纯 bot 群飞书里看不到','err');return;}
    const btn=$('#mNewGo');btn.disabled=true;btn.textContent='建群中…';
    try{const c=await api('/api/feishu/chats/create','POST',{name,memberIds:invitees});chats=chats||[];chats.unshift(c);
      $('#chatListWrap').innerHTML=renderList();bindRows();
      // auto-select the freshly created chat
      select(c.chatId,c.name||'');
      toast('已创建群「'+c.name+'」(bot+管理员已入群),已选中','ok');$('#newChatRow').style.display='none';$('#mNewName').value='';
    }catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.textContent='建群';}};
  $('#mBrowse').onclick=()=>openFsPicker((p)=>{ if(p){setWd(p); toast('已选 '+p,'ok');} });
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=async()=>{const chatId=$('#mChat').value.trim(),workdir=$('#mWd').value.trim(),provider=$('#mProv').value;
    if(!chatId||!workdir){toast('chatId 与 workdir 必填','err');return;}
    try{const r=await api('/api/groups','POST',{chatId,workdir,provider,name:pickedName,platform:plat});S=r;
      const isEdit=boundIds.has(chatId);toast(isEdit?'已保存群项目配置':(r.notified?'已创建群项目,并已在群里发送使用指引':r.noticeQueued?'已创建群项目,使用指引已交给守护进程发往群里':'已创建群项目'),'ok');closeModal();renderAll();}catch(e){toast(e.message,'err');}};
}
// Directory tree picker: browse one level at a time, choose a dir to
// feed back into the workdir field. onPick(path|null) called on confirm/cancel.
async function openFsPicker(onPick){
  const m=$('#fsModal');let cwd='';

// parent dir for the "up" entry; '' at a drive root / POSIX root → back to drive list.
// Pure-string (no Node path/process — this runs in the browser). Handles both
// Windows (D:\…\) and POSIX (/…) path shapes the server returns.
function pathParent(p){
  if(!p) return '';
  const win=/^[A-Za-z]:[\\/]/.test(p);
  const norm=p.replace(/\\/g,'/').replace(/\/+$/,'');
  // drive root like D: → drive list; POSIX root / → drive list/empty
  if(/^[A-Za-z]:$/i.test(norm)) return '';
  if(norm==='/'||norm==='') return '';
  const i=norm.lastIndexOf('/');
  if(i<=0){
    // /foo → /  ;  D:/foo → D:\
    if(norm[0]==='/') return '/';
    if(/^[A-Za-z]:$/i.test(norm.slice(0,2))) return norm.slice(0,2)+'\\';
    return '';
  }
  let parent=norm.slice(0,i);
  if(/^[A-Za-z]:$/i.test(parent)) return parent+'\\'; // D: → D:\
  if(parent==='') return '';
  return win?parent.replace(/\//g,'\\'):parent;
}

let pg={session:null,running:false,abort:null};
function pgMsgEl(role){const m=document.createElement('div');m.className='msg '+role;m.innerHTML=`<div class="role">${role==='user'?'你':'agent'}</div><div class="bubble"></div><div class="tools"></div>`;return m;}
function renderPlayground(){
  const el=$('#playground');
  if(el.dataset.built)return; // build once — keep the conversation across state refreshes
  const provs=S.providers.filter(p=>!p.hidden&&p.configured).map(p=>`<option ${p.name===S.defaultProvider?'selected':''}>${esc(p.name)}</option>`).join('');
  const wd=(S.groups[0]&&S.groups[0].workdir)||'';
  el.innerHTML=`
    <div class="pg-ctl">
      <select id="pgProv">${provs}</select>
      <input id="pgWd" placeholder="workdir 绝对路径(留空=daemon 目录)" value="${esc(wd)}"/>
      <button class="btn" id="pgNew">${IC.plus} 新会话</button>
    </div>
    <div class="pg-msgs" id="pgMsgs"><div class="pg-empty">选 provider、填 workdir,输入任务开始试跑</div></div>
    <div class="pg-in"><textarea id="pgInput" placeholder="输入任务…(Enter 发送 · Shift+Enter 换行)"></textarea><button class="btn primary" id="pgSend">发送</button></div>`;
  el.dataset.built='1';
  $('#pgSend').onclick=()=>{if(pg.running){pg.abort&&pg.abort.abort();}else pgSend();};
  $('#pgNew').onclick=()=>{pg.session=null;$('#pgMsgs').innerHTML='<div class="pg-empty">新会话已开始</div>';toast('新会话','ok');};
  $('#pgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#pgSend').click();}});

async function pgSend(){
  const input=$('#pgInput'),text=input.value.trim();if(!text||pg.running)return;
  const prov=$('#pgProv').value,wd=$('#pgWd').value.trim(),msgs=$('#pgMsgs');
  if($('.pg-empty',msgs))msgs.innerHTML='';
  const um=pgMsgEl('user');$('.bubble',um).textContent=text;msgs.appendChild(um);
  const am=pgMsgEl('agent'),bubble=$('.bubble',am),tools=$('.tools',am);bubble.innerHTML='<span class="cursor"></span>';msgs.appendChild(am);
  msgs.scrollTop=msgs.scrollHeight;input.value='';
  pg.running=true;const send=$('#pgSend');send.textContent='停止';send.classList.remove('primary');
  const ac=new AbortController();pg.abort=ac;const toolSet=new Set();
  try{
    const resp=await fetch('/api/playground/run',{method:'POST',headers:{'Content-Type':'application/json','X-Sbot-Token':TOKEN},body:JSON.stringify({provider:prov,workdir:wd,prompt:text,sessionId:pg.session}),signal:ac.signal});
    await streamSSE(resp,(ev,d)=>{
      if(ev==='session')pg.session=d.sessionId;
      else if(ev==='delta'){bubble.innerHTML=esc(d.text)+'<span class="cursor"></span>';msgs.scrollTop=msgs.scrollHeight;}
      else if(ev==='tool'){(d.tools||[]).forEach(t=>toolSet.add(t));tools.innerHTML=IC.wrench+' '+[...toolSet].map(t=>`<span class="tchip">${esc(t)}</span>`).join('');}
      else if(ev==='done'){bubble.innerHTML=esc(d.text||'(无输出)');if(d.usage)tools.innerHTML+=` <span class="faint">${IC.down}${fmtTok(d.usage.out)}</span>`;if(d.sessionId)pg.session=d.sessionId;if(d.status&&d.status!=='ok')tools.innerHTML+=` <span class="faint">· ${esc(d.status)}</span>`;}
      else if(ev==='error'){bubble.innerHTML='<span style="color:var(--fail)">'+IC.x+' '+esc(d.error)+'</span>';}
    });
  }catch(e){
    const cur=$('.cursor',bubble);if(cur)cur.remove();
    if(e.name==='AbortError')bubble.innerHTML=(bubble.textContent||'')+' <span class="faint">(已停止)</span>';
    else bubble.innerHTML='<span style="color:var(--fail)">'+IC.x+' '+esc(e.message)+'</span>';
  }finally{
    pg.running=false;pg.abort=null;send.textContent='发送';send.classList.add('primary');
    const cur=$('.cursor',bubble);if(cur)cur.remove();msgs.scrollTop=msgs.scrollHeight;
  }
}

  const hint=(!id.desc&&id.descHint&&id.descState!=='ok')?`<div class="fx-ident-hint">${esc(id.descHint).replace(/(application:application:self_manage|admin:app\.info:readonly)/g,'<code>$1</code>')}</div>`:'';

const fxFoldUser={};

// 与飞书身份条同一形状,让两张卡读起来是一套。
function wecomConnText(c){
  if(!c)return '守护进程没有接企业微信(没起、或配置改了还没重启)';
  const bits=[connDetail(c)];
  if(c.state==='connected')bits.push(c.subscribed?'已订阅':'已连上但还没订阅成功');
  if(c.lastAckAt){const s=Math.max(0,Math.round((Date.now()-c.lastAckAt)/1000));bits.push('最近回包 '+(s<60?s+' 秒前':Math.round(s/60)+' 分钟前'));}
  return bits.join(' · ');
}

function bindWecomCard(){

  const creds=()=>{const b={};const id=$('#wId').value.trim();if(id)b.botId=id;const sec=$('#wSecret').value.trim();if(sec)b.secret=sec;return b;}; // 空值不回传:env: 引用时字段渲染为空,回传空串会清掉凭据
  $('#wSave').onclick=async()=>{const b={...creds(),welcome:$('#wWelcome').value.trim(),names:parseNames(),pollSec:$('#wPoll').value.trim(),followSec:$('#wFollow').value.trim(),gatekeeper:{provider:$('#wGate').value,model:$('#wGateModel').value.trim()},keywords:$('#wKeywords').value.trim(),cliOff:$('#wCliOff').checked};
    try{S=await api('/api/wecom','POST',b);toast('企业微信已保存','ok');renderAll();}catch(e){toast(e.message,'err');}};

    try{const r=await api('/api/wecom/identity','POST',{});if(r.name){S=r.state||S;const via=r.source==='identity'?`(身份接口${r.user&&r.user.name?' · 授权用户 '+r.user.name:''})`:`(近 ${r.groups} 个群 · ${r.total} 条 @ 里 ${r.count} 条是它)`;toast((r.changed?`机器人名已更新为「${r.name}」`:`仍是「${r.name}」`)+via,'ok');renderAll();}else toast(r.hint||'没取到','err');}
    catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.textContent='刷新身份';}};
  $('#wPrecheck').onclick=async()=>{const btn=$('#wPrecheck'),box=$('#wCheck');
    btn.disabled=true;btn.innerHTML='<span class="spin"></span> 预检中…';box.innerHTML='';
    try{const c=creds();if(Object.keys(c).length)S=await api('/api/wecom','POST',c); // 预检读的是已存配置,先把填的凭据落盘
      const r=await api('/api/wecom/precheck','POST',{});
      const cls={ok:'ok',warn:'warn',fail:'fail',skip:'skip'};
      box.innerHTML=`<div class="fx-check">${(r.checks||[]).map(c=>`<div class="fx-crow"><span class="dot ${cls[c.status]||'skip'}"></span><span class="cl">${esc(c.label)}</span><span class="cd">${esc(c.detail||'')}</span></div>`).join('')}<div class="fx-note">${esc(r.note||'')}</div></div>`;

    }catch(e){box.innerHTML=`<div class="fx-check"><div class="fx-crow"><span class="dot fail"></span><span class="cd" style="color:var(--fail)">${esc(e.message)}</span></div></div>`;toast(e.message,'err');}
    finally{btn.disabled=false;btn.innerHTML=IC.steth+' 预检';}};
}

// 飞书 WS 连接健康度 —— 与 server.js connHealthStatus/connHealthDetail 同口径(SSE 无重放,
// 心跳带 conn 兜底)。connected=绿 · connecting/reconnecting=黄(自愈中)· 其它=红。
function connStatus(c){if(!c)return 'warn';if(c.state==='connected')return 'ok';if(c.state==='connecting'||c.state==='reconnecting')return 'warn';return 'fail';}
function connDetail(c){if(!c)return '';const label={connected:'已连接',connecting:'连接中',reconnecting:'重连中',failed:'连接失败',stopped:'已停止'}[c.state]||c.state;const bits=[label];if(c.reconnects)bits.push('重连 '+c.reconnects);if(c.rebuilds)bits.push('重建 '+c.rebuilds);if(c.state!=='connected'&&c.lastError)bits.push(String(c.lastError).slice(0,60));return bits.join(' · ');}
// 在概览「健康」卡里就地更新各平台连接行(免整卡重渲染)。S.conn 是按平台名的字典 {feishu,wecom}(双平台并存,

function connDict(c){if(!c)return {};return typeof c.state==='string'?{feishu:c}:c;}
function updateConnLive(){

  {const wl=$('#wConnLine'); if(wl){const c=d.wecom; wl.textContent=wecomConnText(c); const ws=$('#wConnSt'); if(ws){const st=connStatus(c); ws.className='fx-ident-st '+(st==='ok'?'on':(st==='fail'?'off':'')); ws.textContent=c?(c.state==='connected'?'长连接在线':connDetail(c)):'未连接';}}}

    if((c&&!row)||(!c&&row)){renderOverview();return;} // 连接行出现/消失 → 整卡重画
    if(!c||!row)continue;

    row.querySelector('.dot').className='dot '+st;
    const v=row.querySelector('.v'); v.textContent=dt; v.title=dt;
    // 同步 S.health.rows + 汇总 pill,使就地补丁与整卡重渲染口径一致
    if(S.health&&S.health.rows){let r=S.health.rows.find(x=>x.label===label); if(!r){r={label};S.health.rows.push(r);} r.status=st; r.detail=dt;}
  }
  if(S.health&&S.health.rows){S.health.fails=S.health.rows.filter(x=>x.status==='fail').length; S.health.warns=S.health.rows.filter(x=>x.status==='warn').length;
    const pill=$('#ovHealthPill'); if(pill)pill.className='hpill '+healthClass(S.health); const txt=$('#ovHealthTxt'); if(txt)txt.textContent=healthText(S.health);}
}
function fmtUptime(ms){if(!ms)return '';const s=ms/1000,d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return (d?d+'d':'')+h+'h';}
/* 顶栏服务器时钟:显示的是**服务器主机**的时区和时间(hostTz/hostOffsetMin)——
   访客本地钟浏览器自带、群内口径固定(cfg.timezone,默认北京),服务器自己的钟才是
   控制台独有信息;两口径不同时在悬浮提示注明。加载时用 now 校准一次「服务器-浏览器」
   时差,之后本地 setInterval 走秒 —— 不轮询。 */
let svSkew=0;
function fmtOffset(m){const s=m<0?'-':'+';m=Math.abs(m);return 'UTC'+s+pad2(Math.floor(m/60))+':'+pad2(m%60);}
function tickClock(){
  const t=S&&S.time,el=$('#svTime');if(!t||!el)return;
  const d=new Date(Date.now()+svSkew+t.hostOffsetMin*60000); // 服务器本地时间,按 UTC 取分量
  const hm=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes()),ss=':'+pad2(d.getUTCSeconds());
  el.textContent=hm;$('#svSec').textContent=ss;
  $('#svClockWrap').firstChild.title='服务器时间 '+d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())+' '+hm+ss+' · '+(t.hostTz?t.hostTz+' ':'')+fmtOffset(t.hostOffsetMin)
    +(t.tz&&t.tz!==t.hostTz?' · 群内时间口径 '+t.tz+(t.tz==='Asia/Shanghai'?'(北京时间)':''):'');
}
function startClock(){
  const t=S&&S.time;if(!t)return;
  svSkew=t.now-Date.now();
  $('#svTz').textContent=t.hostTz||fmtOffset(t.hostOffsetMin);
  $('#svClockWrap').hidden=false;tickClock();
  if(!startClock._timer)startClock._timer=setInterval(tickClock,1000);
}

const I18N_ATTRS=['title','placeholder','aria-label','alt'];
const I18N_MAP=new Map(I18N_EN);
// 反查表(英 → 中,同英文取第一条):只给下面 i18nZhOrig() 的自愈用,不参与正向翻译
const I18N_BACK=(()=>{const m=new Map();for(const p of I18N_EN)if(!m.has(p[1]))m.set(p[1],p[0]);return m;})();
const I18N_CJK=/[⺀-鿿豈-﫿　-〿！-｠]/;
const I18N_TITLE_ZH=document.title;
function langOf(){return document.documentElement.dataset.lang==='en'?'en':'zh';}
const I18N_SEP=' · ';   // 界面里把可变片段拼成一句的分隔符(与源码里那些模板一致)
/* 单段查表:精确 → 正则;都不中返回 null。正则一律含中文 ⇒ 不含中文的串直接跳过整轮试探(省时) */
function trSeg(k){
  if(!k)return null;
  const hit=I18N_MAP.get(k); if(hit!=null)return hit;
  if(!I18N_CJK.test(k))return null;
  for(let i=0;i<I18N_EN_RX.length;i++){const r=I18N_EN_RX[i]; if(r[0].test(k))return k.replace(r[0],r[1]);}
  return null;
}
/* 单串翻译:中文态原样返回;英文态按「精确 → 正则 → 按「 · 」拆段」查,前后空白原样包回去,
   都不中返回原串。
   ⚠ 拆段兜底是必须的:连接健康度、插件摘要、风格证据行这些是把可变片段用「 · 」拼成**一个**
   文本节点的,组合数几十上百种,穷举不了 —— 整串不中就逐段查,有一段命中就按原分隔符拼回去
   (一段都不中则原样返回,不留半吊子)。 */
function trText(s){
  if(langOf()==='zh')return s;
  const str=String(s==null?'':s), m=str.match(/^(\s*)([\s\S]*?)(\s*)$/), k=m[2];
  if(!k)return s;
  const hit=trSeg(k); if(hit!=null)return m[1]+hit+m[3];
  if(k.includes(I18N_SEP)){
    let any=false;
    const out=k.split(I18N_SEP).map(x=>{const mm=x.match(/^(\s*)([\s\S]*?)(\s*)$/),t=trSeg(mm[2]);
      if(t==null)return x; any=true; return mm[1]+t+mm[3];});
    if(any)return m[1]+out.join(I18N_SEP)+m[3];
  }
  return s;
}
/* 记「中文原值」时的自愈:界面里有一批节点是**镜像**(自绘下拉的标签抄选项文字、按钮跑完把
   先前读到的自己的文字写回去)。英文态下它们第一次被看到时就已经是英文,直接当原值记下来,
   切回中文就再也回不去了 ⇒ 没有中日韩字符且反查表里有,就补回中文当原值。 */
function i18nZhOrig(v){
  if(langOf()!=='en'||I18N_CJK.test(v))return v;
  const m=v.match(/^(\s*)([\s\S]*?)(\s*)$/), z=m[2]&&I18N_BACK.get(m[2]);
  return z?m[1]+z+m[3]:v;
}
// 每个文本节点 / 每个元素的每个属性各记一份 {zh:中文原值, set:我们上次写进去的值}
const _i18nT=new WeakMap(), _i18nA=new WeakMap();
function i18nApplyRec(rec,cur,write){
  const want=langOf()==='zh'?rec.zh:trText(rec.zh);
  if(cur!==want){rec.set=want;write(want);}else rec.set=cur;
}
function i18nText(n){
  const cur=n.nodeValue; if(!cur||!cur.trim())return;           // 纯空白节点不记不译
  let rec=_i18nT.get(n);
  if(!rec||(cur!==rec.zh&&cur!==rec.set)){rec={zh:i18nZhOrig(cur),set:cur};_i18nT.set(n,rec);}
  i18nApplyRec(rec,cur,(v)=>{n.nodeValue=v;});
}
function i18nAttr(el,a){
  const cur=el.getAttribute(a); if(cur==null||!cur.trim())return;
  let box=_i18nA.get(el); if(!box){box={};_i18nA.set(el,box);}
  let rec=box[a];
  if(!rec||(cur!==rec.zh&&cur!==rec.set)){rec=box[a]={zh:i18nZhOrig(cur),set:cur};}
  i18nApplyRec(rec,cur,(v)=>{el.setAttribute(a,v);});
}
function i18nSkip(el){const t=(el.tagName||'').toUpperCase();
  return t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||!!(el.hasAttribute&&el.hasAttribute('data-i18n-skip'));}
function i18nElem(el){
  for(const a of I18N_ATTRS)if(el.hasAttribute&&el.hasAttribute(a))i18nAttr(el,a);
  if(el.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(el.type||'')&&el.hasAttribute('value'))i18nAttr(el,'value');
}
/* 遍历 root 下的文本节点与四个属性;幂等 —— 每次都从 WeakMap 里的中文原值算目标值 */
function applyI18n(root){
  root=root||document.body; if(!root)return;
  if(root.nodeType===3){const p=root.parentElement; if(!p||!p.closest('script,style,textarea,[data-i18n-skip]'))i18nText(root); return;}
  if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
  if(root.nodeType===1){if(i18nSkip(root))return;i18nElem(root);}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,{acceptNode(n){
    return n.nodeType===1&&i18nSkip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  for(let n=w.nextNode();n;n=w.nextNode()){if(n.nodeType===1)i18nElem(n);else i18nText(n);}
}
/* 页面每次重渲染(SSE 心跳 / 切页 / 弹窗)都走这里补译。自触发防护:我们自己写进去的值记在
   rec.set,观察到的还是那个值就当没变 ⇒ 不会来回打转。 */
try{new MutationObserver((muts)=>{
  for(const m of muts){try{
    if(m.type==='childList'){for(const n of m.addedNodes)applyI18n(n);}
    else if(m.type==='characterData'){const n=m.target,p=n.parentElement;
      if(!p||!p.closest('script,style,textarea,[data-i18n-skip]'))i18nText(n);}
    else if(m.type==='attributes'){const el=m.target;
      if(el.nodeType===1&&!i18nSkip(el)&&el.hasAttribute(m.attributeName))i18nAttr(el,m.attributeName);}
  }catch(e){}}
}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTRS});}catch(e){}
/* 原生确认框 / 输入框的提示语也是界面文案。包一层原生实现,好过在十几个调用点各插一次

(function(){const c=window.confirm,p=window.prompt;
  window.confirm=(m)=>c.call(window,trText(m));
  window.prompt=(m,d)=>p.call(window,trText(m),d);})();

/* 版本历史:CHANGELOG.json 经 /api/changelog 一次拉取;当前版本(=顶栏徽章)标「当前」。
   顶栏版本徽章可点 → 跳设置页并滚动到卡片(短暂高亮指位)。
   英文界面另拉一份英文本(/api/changelog-en,按 version 对应):正文是数据不是界面文案,词典翻不了它
   ⇒ 有英文用英文、没有的版本(与条数对不上的条目)原样回退中文;日期与「当前」徽章两语言共用一套。 */
let CHANGELOG=null,CHANGELOG_EN=null;
async function loadChangelog(){
  if(!CHANGELOG){try{CHANGELOG=(await api('/api/changelog')).changelog||[];}catch(e){CHANGELOG=[];}}
  if(langOf()==='en'&&!CHANGELOG_EN){try{CHANGELOG_EN=(await api('/api/changelog-en')).changelog||[];}catch(e){CHANGELOG_EN=[];}}
  const box=$('#verhistBox');if(!box)return;
  const badge=(document.querySelector('.mark .ver')||{}).textContent||'';
  const EN=langOf()==='en'?new Map((CHANGELOG_EN||[]).map(v=>[v.version,v])):null;
  box.innerHTML=CHANGELOG.length?CHANGELOG.map(v=>{const cur=('v'+v.version)===badge;
    const e=(EN&&EN.get(v.version))||null,ei=(e&&e.items)||[];   // 条目按下标对齐
    return `<div class="vh-row${cur?' cur':''}">
    <div class="vh-head"><span class="vh-ver">v${esc(v.version)}</span>${cur?'<span class="chip" style="color:var(--ember);border-color:rgba(var(--ember-rgb),.35)">当前</span>':''}<span class="vh-name">${esc((e&&e.name)||v.name||'')}</span><span class="vh-date">${esc(v.date||'')}</span></div>
    <ul class="vh-items">${(v.items||[]).map((i,n)=>`<li><b>${esc((ei[n]&&ei[n].t)||i.t)}</b> — ${esc((ei[n]&&ei[n].d)||i.d)}</li>`).join('')}</ul>
  </div>`;}).join(''):'<div class="empty">暂无记录</div>';
}

/* ── 自绘下拉组件(见 .csel CSS)：原生 <select> 的弹出列表是 OS 渲染、CSS 改不动 —— 保留 select
   作数据源与可访问性，叠一层可完全主题化的按钮 + 弹层。change 照常派发，所有既有 onchange 零改动。
   用 MutationObserver 自动增强每个新出现的 select，免在每处 render 挂钩。 */
function enhanceSelect(sel){
  if(sel.dataset.enh)return; sel.dataset.enh='1';
  const st=sel.getAttribute('style')||'';
  const autoW=/width:\s*auto/.test(st), mFs=st.match(/font-size:\s*([^;]+)/), mMw=st.match(/min-width:\s*([^;]+)/);
  sel.style.display='none';
  const wrap=document.createElement('div'); wrap.className='csel';
  if(autoW){wrap.style.display='inline-flex'; wrap.style.minWidth=mMw?mMw[1]:'110px';}
  const btn=document.createElement('button'); btn.type='button'; btn.className='csel-btn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  if(mFs)btn.style.fontSize=mFs[1]; if(autoW)btn.style.padding='6px 11px'; if(sel.disabled)btn.disabled=true;
  const lbl=document.createElement('span'); lbl.className='csel-lbl';
  const chev=document.createElement('span'); chev.className='csel-chev';
  chev.innerHTML=IC.chevronDown;
  btn.append(lbl,chev); wrap.appendChild(btn); sel.after(wrap);
  const sync=()=>{const o=sel.options[sel.selectedIndex]; lbl.textContent=o?o.textContent:'';}; sync();
  let pop=null,hl=-1;
  const opts=()=>pop?[...pop.children]:[];
  const setHl=i=>{opts().forEach((el,k)=>el.classList.toggle('hl',k===i)); if(opts()[i])opts()[i].scrollIntoView({block:'nearest'}); hl=i;};
  function close(){if(!pop)return; pop.remove(); pop=null; hl=-1; btn.setAttribute('aria-expanded','false');
    document.removeEventListener('mousedown',onDoc,true); window.removeEventListener('scroll',onScroll,true); window.removeEventListener('resize',close);}
  function pick(i){const o=sel.options[i]; if(!o)return; if(sel.value!==o.value){sel.value=o.value; sel.dispatchEvent(new Event('change',{bubbles:true}));} sync(); close(); btn.focus();}
  function onDoc(e){if(pop&&!pop.contains(e.target)&&!wrap.contains(e.target))close();}
  function onScroll(e){if(pop&&!pop.contains(e.target))close();}  // 关闭仅限弹层外的滚动(内部滚选项不关)
  function open(){
    if(pop){close();return;}
    pop=document.createElement('div'); pop.className='csel-pop'; pop.setAttribute('role','listbox');
    [...sel.options].forEach((o,i)=>{const it=document.createElement('div'); it.className='csel-opt'+(i===sel.selectedIndex?' sel':''); it.setAttribute('role','option'); it.textContent=o.textContent;
      it.addEventListener('mouseenter',()=>setHl(i)); it.addEventListener('mousedown',e=>{e.preventDefault(); pick(i);}); pop.appendChild(it);});
    document.body.appendChild(pop);
    const r=btn.getBoundingClientRect();
    pop.style.minWidth=r.width+'px'; pop.style.maxWidth=(window.innerWidth-16)+'px';
    const pw=pop.offsetWidth, ph=pop.offsetHeight, below=window.innerHeight-r.bottom;
    let left=r.left; if(left+pw>window.innerWidth-8)left=Math.max(8,window.innerWidth-pw-8);
    pop.style.left=left+'px'; pop.style.top=((below<ph+10&&r.top>below)?(r.top-ph-6):(r.bottom+6))+'px';
    btn.setAttribute('aria-expanded','true'); setHl(sel.selectedIndex);
    document.addEventListener('mousedown',onDoc,true); window.addEventListener('scroll',onScroll,true); window.addEventListener('resize',close);
  }
  btn.addEventListener('click',open);
  btn.addEventListener('keydown',e=>{
    if(e.key==='Escape'){close();return;}
    if(e.key==='ArrowDown'){e.preventDefault(); if(!pop)open(); else setHl(Math.min(hl+1,opts().length-1)); return;}
    if(e.key==='ArrowUp'){e.preventDefault(); if(pop)setHl(Math.max(hl-1,0)); return;}
    if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(!pop)open(); else pick(hl);}
  });
}
function enhanceSelects(){document.querySelectorAll('select:not([data-enh])').forEach(enhanceSelect);}
/* 动态重填过 options 的 select:拆掉旧 csel 壳重新增强(壳的标签/选项是构建时快照) */
function reEnhance(sel){if(!sel)return;const w=sel.nextElementSibling;if(w&&w.classList&&w.classList.contains('csel'))w.remove();delete sel.dataset.enh;enhanceSelect(sel);}
/* codex 可用模型(面板下拉数据源):server 端已缓存 10 分钟,前端会话内存一份 */
let CX_MODELS=null;
async function fetchCodexModels(){if(CX_MODELS)return CX_MODELS;try{CX_MODELS=await api('/api/codex/models');}catch(e){CX_MODELS={source:'preset',models:[]};}return CX_MODELS;}
/* codex 卡「推理强度」未设时的显示:默认(该模型的内置档,取自模型列表;未知则只写默认) */
function cxDefEffortLabel(model){const m=CX_MODELS&&(CX_MODELS.models||[]).find(x=>x.model===model);return '默认'+(m&&m.defEffort?'('+m.defEffort+')':'');}
/* 有 codex provider 时启动即预热模型列表(server 缓存 10min)→ 卡片默认档标注补齐 + 面板秒开 */
function warmCodexModels(){if(!CX_MODELS&&S&&(S.providers||[]).some(x=>x.runner==='codex'&&!x.hidden))fetchCodexModels().then(()=>renderProviders());}
try{new MutationObserver(()=>enhanceSelects()).observe(document.body,{childList:true,subtree:true});}catch(e){}
enhanceSelects();

// Build/merge one turn event into the activity feed. Keyed by id (a 'done' updates its
// 'start'), ts-sorted so it's order-independent — the same path serves live SSE (one at a
// time) and a batch replay from /api/activity (下一步 ②). Preserves a row's expand state.
function applyTurnEvent(a){
  if(!a||!a.id)return;
  const entry={id:a.id,ts:a.ts,t:fmtHM(a.ts),group:a.group,sender:a.sender,text:a.text,status:a.kind==='start'?'running':statusLabel(a.status,a.ms),kind:a.kind==='start'?'running':(a.status||''),sec:a.ms?(a.ms/1000).toFixed(1)+'s':'',ms:a.ms,tokens:a.tokens,preview:a.preview,reply:a.reply,tools:a.tools};
  // running 行记一个**浏览器本机**时刻,给上面那道自愈闸当基准。
  // ⚠ 不能拿 a.ts 当基准 —— 那是 daemon 那台机器的钟,与浏览器不是同一把(v0.11.12 同款陷阱)。
  if(entry.status==='running')entry.runAt=Date.now();
  const i=activity.findIndex(x=>x.id===a.id);
  if(i>=0){entry.open=activity[i].open;
    // 重放不刷新 runAt:/api/activity 在每次 SSE 重连时都会重放整段,刷新的话闸门被无限推后、永不自愈
    if(entry.status==='running'&&activity[i].runAt)entry.runAt=activity[i].runAt;
    activity[i]=entry;} else activity.push(entry);
  activity.sort((x,y)=>(y.ts||0)-(x.ts||0)); activity=activity.slice(0,20);
}
// Replay recent activity from the daemon ring buffer — fills SSE gaps: open-into-empty,
// reconnect drops, and rows the self-heal resolved to a bare '✓' without their real done
// data. Idempotent (id-keyed merge). Called on load + on every SSE (re)connect.
async function syncActivity(repaint){
  try{const d=await api('/api/activity'); if(d&&d.activity){d.activity.forEach(applyTurnEvent); if(repaint&&$('#overview').innerHTML)updateOverviewLive();}}catch(e){}
}

/* live push — EventSource can't send headers, so the token rides the query string. */
let esRef=null,helloN=0;
function startLive(){
  try{
    if(esRef){try{esRef.close();}catch{}}
    helloN=0;
    const es=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));esRef=es;
    // hello fires on first connect AND every native reconnect → replay the buffer to
    // recover whatever SSE dropped while we were away (SSE has no replay of its own);
    // 重连(非首连)还拉一次全量 state —— 断流期间的 live/conn 变化就地补齐,不整页重渲染。
    es.addEventListener('hello',()=>{$('#conn').classList.add('live');syncActivity(true);
      if(++helloN>1)api('/api/state').then(r=>{S=r;updateDaemon();updateOverviewLive();updateConnLive();startClock();}).catch(()=>{});});
    es.addEventListener('tick',ev=>{try{const d=JSON.parse(ev.data);if(S){if(d.live)S.live=d.live;if('conn' in d)S.conn=d.conn;}updateDaemon();updateOverviewLive();updateConnLive();}catch{}});
    startAutoRefresh();
    es.addEventListener('conn',ev=>{try{const c=JSON.parse(ev.data);if(S){S.conn=Object.assign({},connDict(S.conn),{[c.platform||'feishu']:c});updateConnLive();}}catch{}}); // 连接状态变化即时推(不等心跳);事件带 platform 名,落进字典对应槽
    es.addEventListener('turn',ev=>{try{applyTurnEvent(JSON.parse(ev.data));updateOverviewLive();}catch(e){}});
    es.onerror=()=>{$('#conn').classList.remove('live');checkStaleAuth();};
  }catch(e){}
}
/* SSE 断流自愈:daemon 重启会作废内存里的 token(页面 token / 登录 session 都是),
   已打开的页面会静默变死(重连永远 401、实时活动/状态全部冻结)。探一针:确是 401 ⇒
   30s 内首次先整页自动重载(环回模式拿新注入 token 直接复活;密码模式落到登录框);
   仍 401(如 30s 内已试过)⇒ 清 token 弹登录。非 401 = 普通断网,交给 EventSource 自动重连。 */
let staleChecking=false;
async function checkStaleAuth(){
  if(staleChecking)return;staleChecking=true;
  try{
    const r=await fetch('/api/activity',{headers:{'X-Sbot-Token':TOKEN}});
    if(r.status===401){
      const last=+sessionStorage.getItem('sbot-reload-ts')||0;
      dropToken();
      if(Date.now()-last>30000){sessionStorage.setItem('sbot-reload-ts',String(Date.now()));location.reload();return;}
      TOKEN='';if(esRef){try{esRef.close();}catch{}}showLogin();
    }
  }catch{}finally{staleChecking=false;}
}
function boot(){ load(); startLive(); }

/* Login gate: shown when the page has no token (password is set). On success the
   session token replaces TOKEN and the console boots normally. No cookie — the token
   lives in memory + sessionStorage, sent via x-sbot-token like everywhere else. */
function showLogin(){
  if($('#loginBg'))return;
  const bg=document.createElement('div');bg.id='loginBg';
  bg.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg)';
  // 公网域名上只出「用飞书登录」(公网入口不放密码登录);本机 / 局域网 IP 仍可密码登录。
  // 服务端没配好飞书登录(FEISHU_LOGIN 为空)时一律出密码框 —— 别把人锁在外面。
  const privateHost=/^(\d{1,3}\.){3}\d{1,3}$|^localhost$|^\[?::1\]?$/.test(location.hostname);
  const showPw=!FEISHU_LOGIN||privateHost;
  const btnCss='display:block;width:100%;box-sizing:border-box;padding:9px;font-size:13px;border-radius:8px;border:0;font-weight:600;cursor:pointer;font-family:var(--sans);text-align:center;text-decoration:none';
  const feishuBtn=FEISHU_LOGIN?`<a id="loginFeishu" href="/api/auth/feishu/start" style="${btnCss};background:var(--ember);color:var(--on-ember)">用飞书登录</a>
    <div style="font-size:11.5px;color:var(--faint);margin:8px 2px 0">只有管理员名单里的人能进</div>`:'';
  const divider=(FEISHU_LOGIN&&showPw)?`<div style="display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--faint);font-size:11px"><span style="flex:1;height:1px;background:var(--line-hi)"></span>或用密码<span style="flex:1;height:1px;background:var(--line-hi)"></span></div>`:'';
  const pwForm=showPw?`<input id="loginPw" type="password" autocomplete="current-password" placeholder="密码" style="width:100%;padding:9px 12px;font-size:13px;border-radius:8px;border:1px solid var(--line-hi);background:var(--input-bg);color:var(--ink);box-sizing:border-box;font-family:var(--sans)"/>
    <div id="loginErr" style="color:var(--fail);font-size:11.5px;min-height:15px;margin:7px 2px 0"></div>
    <button type="submit" style="${btnCss};margin-top:6px;${FEISHU_LOGIN?'background:var(--panel);color:var(--ink);border:1px solid var(--line-hi)':'background:var(--ember);color:var(--on-ember)'}">登录</button>`:'';
  bg.innerHTML=`<form id="loginForm" style="background:var(--panel-hi);border:1px solid var(--line-hi);padding:28px 26px;border-radius:14px;width:min(340px,90vw);box-shadow:0 12px 48px rgba(0,0,0,.45)">
    <div style="font-size:15px;font-weight:600;color:var(--ink)">SintBot 控制台</div>
    <div style="font-size:12px;color:var(--faint);margin:4px 0 16px">${FEISHU_LOGIN?'用你的飞书账号登录':'请输入访问密码'}</div>
    ${feishuBtn}${divider}${pwForm}</form>`;
  document.body.appendChild(bg);
  const form=$('#loginForm');
  if(!showPw){form.onsubmit=e=>e.preventDefault();return;}
  const pw=$('#loginPw');if(!FEISHU_LOGIN)pw.focus();
  form.onsubmit=async(e)=>{e.preventDefault();const errEl=$('#loginErr');errEl.textContent='';
    try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.token){errEl.textContent=(r.status===403&&!privateHost)?'公网入口只支持飞书登录,请管理员先在「设置 → 飞书应用」填公网地址':(j.error||('登录失败 (HTTP '+r.status+')'));pw.select();return;}
      TOKEN=j.token;try{localStorage.setItem('sbot-token',TOKEN);sessionStorage.setItem('sbot-token',TOKEN);}catch{}bg.remove();boot();
    }catch(err){errEl.textContent='网络错误';}};
}

if(TOKEN)boot();else showLogin();
</script>
</body>
